<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004d2a">
<title>SCP Stat Polo Aquático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">

<style>
/* Layout: header verde fixo com navegação por ícones (como o mockup), painéis brancos sobre fundo verde-acinzentado; módulos em grelhas que passam a 1 coluna no telemóvel. */
:root{
  --green:#006633; --deep:#004d2a; --green2:#0d7d45; --yellow:#fcd116; --yellow2:#e9bf00;
  --ink:#102b24; --muted:#5a706a; --line:#d5dfdb; --soft:#e9efed; --bg:#edf2f0; --panel:#ffffff;
  --pool:#2a7db5; --pool2:#22689a; --red:#d93232; --okbg:#d6f2de; --ok:#0d6b33;
  --warnbg:#fff3c4; --warn:#6b5100; --badbg:#fde0df; --bad:#b21f1f; --neutral:#e7ecec;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.topbar{position:relative;z-index:30;background:linear-gradient(100deg,var(--deep),var(--green) 55%,#08783f);color:#fff;box-shadow:0 2px 12px rgba(0,40,20,.25)}
.topbar-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.crest{width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font:800 15px/1 var(--f-display);letter-spacing:.5px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px)}
.brand strong{display:block;font:800 23px/1 var(--f-display);letter-spacing:.5px}
.brand small{display:block;font:600 12px/1 var(--f-display);letter-spacing:2.6px;margin-top:4px;opacity:.92}
.nav{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav a,.hdr-settings a{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-decoration:none;padding:8px 8px;border-radius:9px;font:700 13px/1.05 var(--f-display);letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}
.nav a .ic,.hdr-settings a .ic{width:21px;height:21px}
.nav a:hover,.hdr-settings a:hover{background:rgba(255,255,255,.12)}
.nav a.active,.hdr-settings a.active{background:var(--yellow);color:#0b2e1d;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.hdr-right{display:flex;align-items:center;gap:12px;flex:none}
.hdr-game{font-size:13px;line-height:1.2;text-align:right}
.hdr-game b{font-family:var(--f-display);font-size:16px;letter-spacing:.3px}
.hdr-game .hg-sub{display:block;opacity:.85;font-size:12px}
.seg-period{display:flex;background:rgba(0,0,0,.2);border-radius:10px;padding:3px;gap:2px}
.seg-period button{border:0;background:transparent;color:#fff;font:700 15px/1 var(--f-display);padding:8px 10px;border-radius:7px;min-width:38px}
.seg-period button.on{background:var(--yellow);color:#0b2e1d}
@media (max-width:1700px){.hdr-game{display:none}}
@media (max-width:1560px){.topbar-in{flex-wrap:wrap;row-gap:4px}.nav{order:3;flex-basis:100%;justify-content:flex-start}.hdr-right{margin-left:auto}}
@media (max-width:560px){.brand strong{font-size:20px}.crest{width:40px;height:40px}.hdr-settings a span{display:none}.seg-period button{min-width:32px;padding:8px 7px}}

.demo-banner{background:var(--yellow);color:#2c2300}
.db-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px}

/* ---------- Main ---------- */
main{max-width:1600px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--panel);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 var(--line),0 6px 22px rgba(16,60,45,.06);min-width:0}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.title{margin:0;font:800 clamp(28px,3.2vw,40px)/1 var(--f-display);color:var(--green);text-transform:uppercase;letter-spacing:.3px}
.view-head p,.lead{margin:6px 0 0;color:var(--muted);max-width:68ch}
h2.sub{margin:0;font:800 24px/1.1 var(--f-display);color:var(--deep);letter-spacing:.2px}
h3.mini{margin:0 0 10px;font:700 15px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.eyebrow{margin:0 0 6px;font:700 13px var(--f-display);letter-spacing:2px;text-transform:uppercase;color:var(--green2)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:9px;font-weight:700;font-size:14px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--yellow);border-color:var(--yellow2);color:#13331f}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-outline{border-color:var(--green);color:var(--green)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{background:var(--soft);border-color:transparent}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:#28443c}
.field select,.field input,.field textarea,.inp{width:100%;min-width:0;border:1px solid #c7d5cf;border-radius:8px;padding:9px 11px;background:#fff;min-height:42px}
.field textarea{resize:vertical;min-height:42px}
.inp-sm{min-height:34px;padding:5px 8px;border:1px solid #c7d5cf;border-radius:7px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#f4f7f6;padding:9px 12px;border-radius:8px;font-weight:700;font-size:14px;min-height:40px}
.chip.on{background:var(--green2);color:#fff;border-color:var(--green2)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:7px;font:700 16px var(--f-display);letter-spacing:.3px;min-height:40px}
.seg button.on{background:var(--green);color:#fff}
.mode-switch{display:inline-flex;background:var(--soft);padding:4px;border-radius:10px;gap:4px}
.mode-switch button{border:0;background:transparent;padding:9px 14px;border-radius:7px;font-weight:700;font-size:14px}
.mode-switch button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--green)}
.mode-switch button.on.gk{color:var(--red)}
.warnbox{background:#fff6d6;border:1px solid #efd067;color:#5d4600;padding:10px 12px;border-radius:9px;font-size:14px;margin-top:12px}
.warnbox b{color:#3e2f00}

/* ---------- Tabs (coletiva) ---------- */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:0}
.tab{border:0;background:#e7edeb;color:#153a32;padding:13px 8px;border-radius:10px 10px 0 0;font:700 16px/1.1 var(--f-display);letter-spacing:.2px}
.tab small{display:block;font-size:12px;opacity:.65;letter-spacing:1px}
.tab.on{background:var(--yellow);color:#073c26}
.form-grid{border:1px solid var(--line);border-radius:0 0 12px 12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;background:#fbfcfc}
.field.wide{grid-column:span 2}
.timing{display:flex;gap:6px}
.timing button{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;background:#eef1f2;font-weight:800;min-height:42px}
.timing button.on{background:var(--green2);border-color:var(--green2);color:#fff}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
@media (max-width:1050px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.tab{border-radius:10px}.form-grid{border-radius:12px;margin-top:8px}}
@media (max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.field.wide{grid-column:1/-1}.form-actions>*{flex:1}}

/* combobox pesquisável */
.combo{position:relative}
.combo input{padding-right:30px}
.combo .chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.combo-list{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:#fff;border:1px solid #c7d5cf;border-radius:9px;box-shadow:0 10px 24px rgba(10,40,30,.16);max-height:260px;overflow:auto}
.combo-list li{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.combo-list li.on,.combo-list li:hover{background:#e3f4ea}
.combo-list li.none{color:var(--muted);cursor:default;background:none}
.combo-list mark{background:#fff0a5;color:inherit;border-radius:2px}

/* ---------- Records ---------- */
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.filters .field{min-width:130px;flex:1 1 150px}
.filters .field label{font-size:12px}
.filters select{min-height:38px;padding:6px 9px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--deep);color:#fff;padding:10px 9px;text-align:center;white-space:nowrap;font-weight:700;font-size:12.5px;letter-spacing:.3px}
td{border-top:1px solid #dde5e2;padding:8px 9px;text-align:center;font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left}
tbody tr:nth-child(even){background:#f6f9f8}
tbody tr:hover{background:#eaf5ef}
.count{color:var(--muted);font-size:13px;margin:10px 2px 0}
.empty{padding:22px;color:#6f8380}
.rowbtn{border:0;border-radius:6px;width:32px;height:30px;display:inline-grid;place-items:center;margin:0 2px;background:var(--green2);color:#fff}
.rowbtn.del{background:var(--red)}
.rowbtn .ic{width:15px;height:15px}
.badge{display:inline-block;padding:4px 9px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.3px;min-width:84px;white-space:nowrap}
.t-good{background:#c8f0d5;color:#075b2d}.t-bad{background:#ffe0df;color:#b21f1f}.t-warn{background:#fff0a5;color:#6b5100}.t-neutral{background:var(--neutral);color:#3e5552}
.act-cell{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.shape{width:14px;height:14px;flex:none;overflow:visible}
.sumstrip{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:#f3f7f5;border-radius:10px;font-size:14px}
.sumstrip b{font:800 22px/1 var(--f-display);color:var(--deep);margin-right:4px}

/* ---------- Home ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(115deg,#ffffff 0 55%,#e9f5ee)}
.home-hero .title{font-size:clamp(40px,5vw,64px)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--deep);color:#fff;border-radius:14px;padding:16px 18px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.sb-team span{font:700 14px/1.1 var(--f-display);letter-spacing:1px;text-transform:uppercase;opacity:.9;overflow-wrap:anywhere}
.sb-team b{font:800 54px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sb-mid{text-align:center;font:700 13px var(--f-display);letter-spacing:1.5px;text-transform:uppercase}
.sb-mid small{display:block;font:800 22px var(--f-display);color:var(--yellow);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.game-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.prog-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.prog{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:#fff}
.prog:hover{border-color:var(--green2);background:#f4faf6}
.prog .pi{width:44px;height:44px;border-radius:10px;background:#e3f2e9;color:var(--green);display:grid;place-items:center}
.prog .pi .ic{width:22px;height:22px}
.prog b{font:800 19px/1.1 var(--f-display);letter-spacing:.3px;color:var(--deep);text-transform:uppercase}
.prog p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.prog .pc{font:800 22px/1 var(--f-display);color:var(--deep);text-align:right}
.prog .pc small{display:block;font:600 11px var(--f-body);color:var(--muted);letter-spacing:.5px}
.sprint-row{display:grid;grid-template-columns:48px auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sprint-row:first-of-type{border-top:0}
.sprint-row .pn{font:800 20px var(--f-display);color:var(--deep)}
.sprint-row .chip{padding:7px 11px;min-height:36px}
.chip.on.opp{background:#5b6b68;border-color:#5b6b68}
.store-list{margin:8px 0 0;padding-left:18px;color:#33504a;font-size:14px}
.store-list li{margin:4px 0}
.cur-pill{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
@media (max-width:900px){.home-hero,.home-grid{grid-template-columns:1fr}.prog{grid-template-columns:40px minmax(0,1fr) auto}.prog .btn{display:none}}

/* ---------- Individual ---------- */
.ind-layout{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(320px,1.5fr) minmax(250px,1fr);grid-template-areas:"a b c";gap:16px;align-items:start}
.ind-a{grid-area:a}.ind-b{grid-area:b}.ind-c{grid-area:c}
.ind-a,.ind-b,.ind-c{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.ind-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"a b" "c b"}}
@media (max-width:760px){.ind-layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c"}}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfc}
.step-h{display:flex;align-items:center;gap:8px;font:700 16px var(--f-display);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;color:#1e3d35}
.step-h .opt{margin-left:auto;font:600 12px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.step-n.done{background:var(--yellow);color:#0b2e1d}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.cap{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;min-width:0;min-height:42px}
.cap .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e4ece9;color:var(--deep);font:800 15px var(--f-display);flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #c9d6d1}
.cap.gk .num{background:#fbe1df;color:#b21f1f}
.cap .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cap.on{border-color:var(--green);background:#e6f5ec;box-shadow:inset 0 0 0 1px var(--green)}
.cap.on .num{background:var(--green);color:#fff}
.cap.gk.on{border-color:var(--red);background:#fdeceb;box-shadow:inset 0 0 0 1px var(--red)}
.cap.gk.on .num{background:var(--red);color:#fff}
.cap.dim{opacity:.4}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.act{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:13.5px;text-align:left;min-height:42px;min-width:0}
.act span{min-width:0;overflow-wrap:anywhere}
.act.on{background:#123d2e;color:#fff;border-color:#123d2e}
.pitch-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f7faf9}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pc-h b{font:700 16px var(--f-display);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.zone-tag{font:700 14px var(--f-display);letter-spacing:.3px;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--muted)}
.zone-tag.set{background:var(--green);border-color:var(--green);color:#fff}
.court{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:2/1;border-radius:8px;cursor:crosshair;touch-action:manipulation;user-select:none}
.pitch-card.na .court{opacity:.35;cursor:not-allowed}
.pitch-card .na-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.court text{font-family:var(--f-display);font-weight:700;pointer-events:none}
.mk{transition:transform .15s}
.mk.hl{transform-box:fill-box;transform-origin:center;transform:scale(1.9)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:#33504a}
.legend span{display:inline-flex;align-items:center;gap:5px}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:700}
.req.ok{background:var(--okbg);color:var(--ok)}
.editing-note{background:#e3f0fb;color:#1d4f7a;border-radius:9px;padding:8px 11px;font-size:13.5px}

/* ---------- Tempo ---------- */
.clock-panel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,.7fr);gap:14px;align-items:stretch}
.clock-box{background:var(--deep);color:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clock-box .cp{font:700 14px var(--f-display);letter-spacing:2px;text-transform:uppercase;opacity:.85}
.clock{font:800 72px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock.running{color:var(--yellow)}
.clock-box .btn-row .btn{min-width:0}
.clock-box .btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.clock-set{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.clock-set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clock-set select{min-height:42px;border:1px solid #c7d5cf;border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}
.onfield{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.onfield b{font:800 64px/1 var(--f-display);color:var(--green);font-variant-numeric:tabular-nums}
.onfield b.full{color:var(--red)}
.onfield span{font:700 15px var(--f-display);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
@media (max-width:980px){.clock-panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.onfield{grid-column:1/-1;flex-direction:row;gap:10px}}
@media (max-width:600px){.clock-panel{grid-template-columns:minmax(0,1fr)}.clock{font-size:60px}}
.capnum{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e4ece9;color:var(--deep);font:800 15px var(--f-display)}

.state{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--neutral);color:#4b5f5b}

.tbar{width:110px}

/* ---------- Exclusões ---------- */

.exb{width:38px;height:38px;border-radius:8px;border:2px solid #cdd8d4;background:#fff;font:800 14px var(--f-display);color:#7d8f8b;margin:0 1px}

/* ---------- Análise ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfcfc}
.kpi .k{font:700 13px var(--f-display);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:4px}

.ins.good .dot{background:var(--okbg);color:var(--ok)}

.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

@media (max-width:760px){.an-grid,.an-grid3{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:7px}

.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}

/* ---------- Modal / toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(8,30,22,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:470px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}

.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,520px);pointer-events:none}
.toast{background:#123d2e;color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease-out}

/* ---------- Remates / Guarda-Redes / Jogadores / Definições ---------- */
.two-maps{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}

.fbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.mx td.zl,.mx th.zl{text-align:left;white-space:nowrap}

@media (max-width:700px){.prof{grid-template-columns:auto minmax(0,1fr)}.prof .pmeta{grid-column:1/-1;justify-content:space-between}}
.roster-tbl td{padding:5px 6px}
.roster-tbl input,.roster-tbl select{width:100%;min-width:90px}
.gk-chips{display:flex;gap:8px;flex-wrap:wrap}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.set-grid{grid-template-columns:minmax(0,1fr)}}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row b{display:block;font-size:14.5px}
.set-row span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.switch{position:relative;width:50px;height:28px;border-radius:999px;border:0;background:#c8d4d0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}

.store-meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.store-meter i{display:block;height:100%;background:var(--green2)}
.steps-list{margin:8px 0 0;padding-left:20px;font-size:14px;color:#33504a}
.steps-list li{margin:5px 0}
code.path{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:13px}

/* substituições */
.clock-note{font-size:13px;color:#ffe680;font-weight:600}
.sub-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:12px}
@media (max-width:800px){.sub-grid{grid-template-columns:minmax(0,1fr)}}
.sub-lbl{display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px;font-size:12px}
.sub-lbl.out{color:var(--bad)}.sub-lbl.in{color:var(--ok)}
.sub-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px}
.sub-chip .capnum{width:28px;height:28px;font-size:14px}
.sub-chip.out.on{background:var(--red);border-color:var(--red);color:#fff}
.sub-chip.in.on{background:var(--green2);border-color:var(--green2);color:#fff}
.modal-actions .btn-outline{flex:1 1 180px;justify-content:flex-start}

/* PWA */
.topbar{padding-top:env(safe-area-inset-top,0px)}
.hdr-install{border:2px solid var(--yellow);background:transparent;color:var(--yellow);font:700 14px var(--f-display);letter-spacing:.6px;text-transform:uppercase;padding:7px 12px;border-radius:9px;min-height:38px}
.hdr-install:hover{background:var(--yellow);color:#0b2e1d}
.install-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center}
.install-card .pi{width:44px;height:44px;border-radius:10px;background:#e3f2e9;color:var(--green);display:grid;place-items:center}
.install-card .pi .ic{width:22px;height:22px}
.install-card b{font:800 19px/1.1 var(--f-display);color:var(--deep);text-transform:uppercase;letter-spacing:.3px}
.install-card p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
@media (max-width:560px){.install-card{grid-template-columns:40px minmax(0,1fr)}.install-card .btn{grid-column:1/-1}.hdr-install{padding:6px 9px;font-size:13px}}
.update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:110;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--deep);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-weight:600;font-size:14px;width:max-content;max-width:calc(100vw - 32px)}
html.standalone body{overscroll-behavior-y:none}

/* base de dados da equipa */
.hdr-cloud{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#fff;font:700 13px var(--f-display);letter-spacing:.5px;text-transform:uppercase;padding:7px 11px;border-radius:999px;min-height:36px;white-space:nowrap}
.hdr-cloud .dot,.cloud-pill .dot{width:9px;height:9px;border-radius:50%;background:#9fb3ad;flex:none}
.hdr-cloud.ok .dot,.cloud-pill.ok .dot{background:#4ade80}
.hdr-cloud.busy .dot,.cloud-pill.busy .dot{background:var(--yellow);animation:cpulse 1s ease-in-out infinite}
.hdr-cloud.warn .dot,.cloud-pill.warn .dot{background:#f59e0b}
.hdr-cloud.bad .dot,.cloud-pill.bad .dot{background:#ff6b6b}
.hdr-cloud.login{border-color:var(--yellow);color:var(--yellow)}
.hdr-cloud.login .dot{background:var(--yellow)}
@keyframes cpulse{50%{opacity:.35}}
.cloud-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--soft);font-weight:700;font-size:13px}
.cloud-pill.ok{background:var(--okbg);color:var(--ok)}.cloud-pill.warn,.cloud-pill.login{background:var(--warnbg);color:var(--warn)}.cloud-pill.bad{background:var(--badbg);color:var(--bad)}
@media (max-width:560px){.hdr-cloud .cl-txt{display:none}.hdr-cloud{padding:7px 9px}}

.linkbtn{border:0;background:none;padding:0;color:var(--green2);font-weight:700;text-decoration:underline;cursor:pointer}

/* ---------- Quadro Tático ---------- */
.tb-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:14px;align-items:start}
.tb-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.tb-side{display:flex;flex-direction:column;gap:12px}
.tb-side textarea,.tb-side input,.tb-side select{width:100%}
.tb-toolbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.tb-group{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tb-glabel{font:700 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-right:3px}
.tb-tool,.tb-add{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f4f7f6;border-radius:8px;padding:6px 10px;min-height:36px;font-weight:700;font-size:13px}
.tb-tool.on{background:var(--green);border-color:var(--green);color:#fff}
.tb-tool .ic{width:15px;height:15px}
.tb-sw{display:inline-block;width:18px;height:4px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tb-sw.dash{background:none;border-top:3px dashed;height:0;box-shadow:none}
.tb-cap{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tb-board{position:relative;border-radius:12px;overflow:hidden;background:#dfe8e5;box-shadow:inset 0 0 0 1px var(--line)}
.tb-svg{display:block;margin:0 auto;width:100%;height:auto;max-height:72vh;max-width:calc(72vh * var(--tb-r,1.47));touch-action:none;user-select:none;-webkit-user-select:none}
.tb-svg .tb-piece{cursor:grab}
.tb-svg[data-tool$="arrow"]{cursor:crosshair}.tb-svg[data-tool$="arrow"] .tb-piece{cursor:crosshair}
.tb-svg[data-tool="erase"],.tb-svg[data-tool="erase"] .tb-piece{cursor:not-allowed}
.tb-arrow.draft{opacity:.75}
.tb-fullbar{display:none}
.tb-board.isfull{display:flex;flex-direction:column;justify-content:center;background:#123}
.tb-board.isfull .tb-svg{max-height:calc(100vh - 60px);max-width:calc((100vh - 60px) * var(--tb-r,1.47));margin:auto}
.tb-board.isfull .tb-fullbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;background:rgba(0,0,0,.45);color:#fff}
.tb-board.isfull .tb-fullbar .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.tb-steplbl{font:700 15px var(--f-display);letter-spacing:.3px;min-width:180px;text-align:center}
.tb-stepsbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tb-steps{display:flex;flex-wrap:wrap;gap:4px}
.tb-stepchip{min-width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#f4f7f6;font:700 15px var(--f-display)}
.tb-stepchip.on{background:var(--yellow);border-color:var(--yellow2);color:#0b2e1d}
.tb-stepchip.add{border-style:dashed;color:var(--green)}
.tb-stepctl{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.tb-selbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:40px;padding:6px 10px;border:1px dashed var(--line);border-radius:10px;background:#fbfcfc}
.tb-selname{font-weight:700}
.tb-cats{margin:8px 0}
.tb-cats .chip{min-height:32px;padding:5px 9px;font-size:12.5px}
.tb-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.tb-item{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tb-item span{font-size:12.5px;color:var(--muted)}
.tb-item.on{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green);background:#f1f8f4}
@media (max-width:1100px){.tb-layout{grid-template-columns:minmax(0,1fr)}.tb-stepctl{margin-left:0}}
@media (max-width:560px){.tb-toolbar{gap:8px}.tb-tool,.tb-add{padding:5px 8px;font-size:12.5px}.tb-svg{max-height:none;max-width:100%}}
.tb-mobilehint{display:none;margin:0}
@media (max-width:700px){.tb-mobilehint{display:block}}

</style>
</head>

<script>
(()=>{'use strict';
/* =========================================================
   SCP STAT — POLO AQUÁTICO · núcleo (utilitários, armazenamento, navegação)
   ========================================================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const PERIODS=['1º','2º','3º','4º'];
const STORE_KEY='scpStatPoloAquatico.v1';
const pct=(a,b)=>b?Math.round(a*100/b):0;
const r3=v=>Math.round(v*1000)/1000;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtClock(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function parseClock(str){const m=String(str??'').trim().match(/^(\d{1,2})(?:\s*[:.,'h]\s*(\d{1,2}))?$/);if(!m)return null;const sec=+(m[2]||0);if(sec>59)return null;return +m[1]*60+sec}
function fmtDate(iso){if(!iso)return '';const p=String(iso).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso}
function numPT(v,dec=1){return v==null||v===''?'':String(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).replace('.',',')}
function parseNum(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}

const S=()=>(typeof DB!=='undefined'&&DB.settings)||DEFAULT_SETTINGS;
const POSITIONS=['Guarda-redes','Pivot','Defesa-pivot','Ponta','Lateral','Central','Universal'];
function defaultRoster(){return Array.from({length:15},(_,i)=>({n:i+1,name:'',gr:i===0||i===12,pos:i===0||i===12?'Guarda-redes':'',hand:''}))}
function defaultOpp(){return Array.from({length:13},(_,i)=>({n:i+1,name:''}))}
function newGame(base,opts={}){
 const L=S().periodLength||480;
 return {
  id:uid(), scpName:S().teamName||'Sporting CP', opponent:'Adversário', date:todayISO(), competition:'', venue:'',
  period:'1º', periodLength:L,
  roster: base&&opts.keepRoster? base.roster.map(p=>({...p})) : defaultRoster(),
  oppRoster: defaultOpp(),
  individual:[], collective:[],
  timer:{events:[], remaining:L, running:false, startedAt:0, seq:0},
  excl:{scp:{},opp:{}}, exclLog:[],
  sprints:PERIODS.map(p=>({period:p,winner:'',player:''})),
  demo:false, created:Date.now(), updated:Date.now()
 };
}
function normalizeGame(g){
 const b=newGame();
 for(const k of Object.keys(b)) if(g[k]===undefined||g[k]===null) g[k]=b[k];
 const r=defaultRoster(); (Array.isArray(g.roster)?g.roster:[]).forEach(p=>{if(p&&p.n>=1&&p.n<=15)r[p.n-1]={...r[p.n-1],...p}}); g.roster=r;
 const o=defaultOpp(); (Array.isArray(g.oppRoster)?g.oppRoster:[]).forEach(p=>{if(p&&p.n>=1&&p.n<=13)o[p.n-1]={...o[p.n-1],...p}}); g.oppRoster=o;
 g.timer={...b.timer,...g.timer}; if(!Array.isArray(g.timer.events))g.timer.events=[];
 g.excl=g.excl||{}; g.excl.scp=g.excl.scp||{}; g.excl.opp=g.excl.opp||{};
 if(!Array.isArray(g.sprints)||g.sprints.length!==4) g.sprints=b.sprints;
 ['individual','collective','exclLog'].forEach(k=>{if(!Array.isArray(g[k]))g[k]=[]});
 if(!PERIODS.includes(g.period))g.period='1º';
 return g;
}

/* ---------- Modal e avisos (sem alert/confirm do browser) ---------- */
function modal({title,body,actions,onOpen}){
 return new Promise(res=>{
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="modal-body">${body}</div><div class="modal-actions">${actions.map((a,i)=>`<button type="button" class="btn ${a.cls||''}" data-mi="${i}">${esc(a.label)}</button>`).join('')}</div></div></div>`;
  const back=root.firstElementChild;
  const close=v=>{root.innerHTML='';document.removeEventListener('keydown',key);res(v)};
  const key=e=>{if(e.key==='Escape')close(null)};
  document.addEventListener('keydown',key);
  back.addEventListener('click',e=>{if(e.target===back)close(null)});
  $$('[data-mi]',root).forEach(b=>b.onclick=()=>{const a=actions[+b.dataset.mi];const v=a.get?a.get(root):(a.value!==undefined?a.value:true);close(v)});
  const f=root.querySelector('input,select,[data-mi]:last-child'); if(f)f.focus();
  if(onOpen)onOpen(root);
 });
}
function confirmBox(title,msg,ok='Confirmar',danger=true){return modal({title,body:`<p>${msg}</p>`,actions:[{label:'Cancelar',cls:'btn-ghost',value:false},{label:ok,cls:danger?'btn-danger':'btn-primary',value:true}]})}
function toast(msg,type=''){
 const root=$('#toast-root'); if(!root)return;
 const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; root.appendChild(t);
 setTimeout(()=>t.remove(),type==='warn'||type==='bad'?4200:2400);
}

/* ---------- CSV / ficheiros ---------- */
function csvCell(v){v=v==null?'':String(v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function download(name,text,type='text/csv;charset=utf-8'){
 const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Ficheiro exportado: '+name);
}
function parseCSV(text){
 text=String(text).replace(/^﻿/,'');
 const first=text.split(/\r?\n/)[0]||'';
 const sep=first.split(';').length>=first.split(',').length?';':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true; else if(c===sep){row.push(f);f=''} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r')f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function csvObjects(text){const rows=parseCSV(text);if(rows.length<2)return [];const h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()])))}
function pickFile(accept){
 return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept=accept;
  inp.onchange=()=>{const f=inp.files[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>res({name:f.name,text:String(r.result)});r.onerror=()=>res(null);r.readAsText(f,'utf-8')};
  inp.click()});
}

async function setPeriod(p){
 const g=G(); if(g.period===p)return;
 const later=g.timer.events.filter(e=>PERIODS.indexOf(e.period)>PERIODS.indexOf(p));
 if(later.length){
  const last=PERIODS[Math.max(...later.map(e=>PERIODS.indexOf(e.period)))];
  if(!await confirmBox('Voltar a um período anterior?',`Já há ${later.length} entrada(s)/saída(s) registadas até ao <b>${last} período</b>. Se voltares ao ${p} período e registares mais movimentos, os tempos de jogo ficam errados.<br><br>Para experimentar a app, cria antes um jogo novo em Início.`,'Mudar mesmo assim'))return;
 }
 g.period=p;
 if(S().resetClockOnPeriod){g.timer.running=false;g.timer.remaining=g.periodLength}
 save(); rerender(); toast(p+' período ativo'+(S().resetClockOnPeriod?' · relógio reposto a '+fmtClock(g.periodLength):''));
}
function scoreOf(g){
 const sum=t=>Object.values(g.excl[t]||{}).reduce((a,x)=>a+(x.goals||0),0);
 return {scp:sum('scp'),opp:sum('opp')};
}

function shapeSVG(shape,x,y,s,fill,stroke,sw){

 const st=`fill="${fill}" stroke="${stroke}" stroke-width="${f(sw)}"`;
 if(shape==='square')return `<rect x="${f(x-s)}" y="${f(y-s)}" width="${f(2*s)}" height="${f(2*s)}" rx="${f(s*.18)}" ${st}/>`;
 if(shape==='triangle')return `<polygon points="${f(x)},${f(y-s*1.2)} ${f(x+s*1.15)},${f(y+s*.85)} ${f(x-s*1.15)},${f(y+s*.85)}" stroke-linejoin="round" ${st}/>`;

 return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(s)}" ${st}/>`;
}

function bindCombo(root,opts){
 const inp=root.querySelector('input'),list=root.querySelector('ul');let items=[],idx=0,typed=false;
 const hl=o=>{const q=norm(inp.value);if(!typed||!q)return esc(o);const i=norm(o).indexOf(q);return i<0?esc(o):esc(o.slice(0,i))+'<mark>'+esc(o.slice(i,i+q.length))+'</mark>'+esc(o.slice(i+q.length))};
 const show=()=>{const q=norm(inp.value);items=typed&&q?opts.filter(o=>norm(o).includes(q)):opts.slice();if(idx>=items.length)idx=0;
  list.innerHTML=items.length?items.map((o,i)=>`<li role="option" data-v="${esc(o)}" class="${i===idx?'on':''}">${hl(o)}</li>`).join(''):'<li class="none">Sem resultados</li>';list.hidden=false;inp.setAttribute('aria-expanded','true');
  const on=list.querySelector('li.on');if(on)on.scrollIntoView({block:'nearest'})};
 const hide=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false')};
 const choose=v=>{inp.value=v;typed=false;hide();inp.dispatchEvent(new Event('change',{bubbles:true}))};
 inp.addEventListener('focus',()=>{typed=false;idx=Math.max(0,opts.indexOf(inp.value));show();inp.select()});
 inp.addEventListener('input',()=>{typed=true;idx=0;show()});
 inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(list.hidden)show();idx=Math.min(items.length-1,idx+1);show()}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(0,idx-1);show()}
  else if(e.key==='Enter'){if(!list.hidden&&items[idx]){e.preventDefault();choose(items[idx])}}
  else if(e.key==='Escape'){hide()}
  else if(e.key==='Tab'){if(!list.hidden&&typed&&items[idx])choose(items[idx])}});
 list.addEventListener('mousedown',e=>{e.preventDefault();const li=e.target.closest('li[data-v]');if(li)choose(li.dataset.v)});
 inp.addEventListener('blur',()=>{setTimeout(()=>{hide();if(inp.value&&!opts.includes(inp.value)){const m=opts.find(o=>norm(o)===norm(inp.value))||(items.length===1?items[0]:null);inp.value=m||'';if(!m)toast('Escolhe uma opção da lista.','warn')}typed=false},120)});
}


const maxPool=()=>S().maxInPool||7;
function clockNow(){const t=G().timer;if(!t.running)return t.remaining;return Math.max(0,t.remaining-(Date.now()-t.startedAt)/1000)}
function absTime(period,clock){const L=G().periodLength;return Math.max(0,PERIODS.indexOf(period))*L+(L-clock)}
function nowAbs(){return absTime(G().period,clockNow())}
/* Quem está na água: decidido pela ORDEM em que os movimentos foram registados (seq),
   não pelo relógio — assim mudar de período ou acertar o relógio nunca baralha o estado.
   A duração de cada turno vem do período + relógio de cada movimento. */
function computeShifts(){
 const g=G(),ev=g.timer.events.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)||(a.ts||0)-(b.ts||0));
 const res={},issues=new Set();g.roster.forEach(p=>res[p.n]={inSince:null,inEv:null,shifts:[],closed:0});
 ev.forEach(e=>{const s=res[e.n];if(!s)return;const t=absTime(e.period,e.clock);
  if(e.type==='in'){if(s.inSince==null){s.inSince=t;s.inEv=e.id}else issues.add(e.id)}
  else if(s.inSince!=null){const raw=t-s.inSince;if(raw<0){issues.add(e.id);issues.add(s.inEv)}const d=Math.max(0,raw);s.shifts.push({from:s.inSince,to:t,dur:d});s.closed+=d;s.inSince=null;s.inEv=null}
  else issues.add(e.id)});
 const now=nowAbs();
 Object.values(res).forEach(s=>{s.on=s.inSince!=null;s.ahead=s.on&&now<s.inSince;s.open=s.on?Math.max(0,now-s.inSince):0;s.total=s.closed+s.open;s.count=s.shifts.length+(s.on?1:0);s.last=s.on?s.open:(s.shifts.length?s.shifts[s.shifts.length-1].dur:0)});
 computeShifts.issues=issues;
 return res;
}

/* =========================================================
   BASE DE DADOS DA EQUIPA (Firebase Firestore)
   - A app continua a trabalhar sobre a cópia local (funciona sem rede).
   - Cada registo é um documento: jogos/{jogo} (dados gerais) e jogos/{jogo}/registos/{registo}.
   - Envio: compara o estado local com o último estado sincronizado (impressões digitais) e envia só o que mudou.
   - Receção: só aplica o que mudou mesmo na nuvem desde a última sincronização (fusão a 3 vias),
     por isso edições locais ainda por enviar não se perdem.
   - Jogos de exemplo nunca são enviados.
   ========================================================= */

const META_FIELDS=['scpName','opponent','date','competition','venue','period','periodLength','roster','oppRoster','timer','sprints','created','updated'];

/* ---------- funções puras (testadas fora do browser) ---------- */
function stableStr(v){
 if(v===undefined)return 'null';
 if(v===null||typeof v!=='object')return JSON.stringify(v);
 if(Array.isArray(v))return '['+v.map(stableStr).join(',')+']';
 return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(36)}
const hashOf=v=>fnv(stableStr(v));
const plain=v=>JSON.parse(JSON.stringify(v===undefined?null:v));
function metaOf(g){
 const m={};
 META_FIELDS.forEach(k=>{m[k]=k==='timer'?{remaining:g.timer.remaining,running:!!g.timer.running,startedAt:g.timer.startedAt||0,seq:g.timer.seq||0}:g[k]});
 return plain(m);
}
/** documentos de registo de um jogo: id do documento -> conteúdo */
function recDocsOf(g){
 const out={};
 const add=(pre,tipo,arr)=>(arr||[]).forEach(r=>{out[pre+r.id]=plain({...r,tipo})});
 add('ind_','ind',g.individual);add('col_','col',g.collective);add('tmp_','tmp',g.timer.events);add('exl_','exl',g.exclLog);
 // só jogadores com alguma coisa registada (o ecrã das Exclusões cria entradas a zero para todos)
 ['scp','opp'].forEach(t=>Object.entries((g.excl||{})[t]||{}).forEach(([n,o])=>{if(!(o.ex||o.red||o.goals))return;out[`exc_${t}_${n}`]={tipo:'exc',team:t,n:+n,ex:o.ex||0,red:!!o.red,goals:o.goals||0}}));
 return out;
}
/** o que mudou localmente desde a última sincronização */
function diffGame(g,synced){
 const next={...synced},meta={},sets={},dels=[];let hasMeta=false;
 const m=metaOf(g);
 META_FIELDS.forEach(k=>{const h=hashOf(m[k]);if(next['m:'+k]!==h){meta[k]=m[k];next['m:'+k]=h;hasMeta=true}});
 const recs=recDocsOf(g);
 Object.entries(recs).forEach(([id,p])=>{const h=hashOf(p);if(next[id]!==h){sets[id]=p;next[id]=h}});
 Object.keys(next).forEach(k=>{if(!k.startsWith('m:')&&!(k in recs)){dels.push(k);delete next[k]}});
 return {meta:hasMeta?meta:null,sets,dels,next};
}
const stripCloud=d=>{const o={...d};delete o.upd;delete o.del;return o};
/** aplica um documento de registo vindo da nuvem; devolve true se mudou o jogo local */
function applyRecDoc(g,synced,id,data){
 const remote=data.del?null:stripCloud(data);
 const rh=remote?hashOf(remote):undefined;
 if(synced[id]===rh)return false;            // nada mudou na nuvem para este registo
 const t=id.slice(0,3);
 if(t==='exc'){
  const p=id.split('_'),team=p[1],n=p[2];
  if(team!=='scp'&&team!=='opp')return false;
  g.excl[team]=g.excl[team]||{};
  if(remote)g.excl[team][n]={ex:remote.ex||0,red:!!remote.red,goals:remote.goals||0};else delete g.excl[team][n];
 }else{
  const arr=t==='ind'?g.individual:t==='col'?g.collective:t==='tmp'?g.timer.events:t==='exl'?g.exclLog:null;
  if(!arr)return false;
  const rid=id.slice(4),i=arr.findIndex(r=>r.id===rid);
  if(remote){const rec={...remote};delete rec.tipo;if(i>=0)arr[i]=rec;else arr.push(rec)}
  else if(i>=0)arr.splice(i,1);
 }
 if(remote)synced[id]=rh;else delete synced[id];
 return true;
}
/** aplica os dados gerais de um jogo vindos da nuvem (só os campos que mudaram lá) */
function applyMeta(g,synced,data){
 let changed=false;
 META_FIELDS.forEach(k=>{
  if(!(k in data))return;
  const v=plain(data[k]),h=hashOf(v);
  if(synced['m:'+k]===h)return;
  if(k==='timer')g.timer={...g.timer,...v,events:g.timer.events};else g[k]=v;
  synced['m:'+k]=h;changed=true;
 });
 return changed;
}

/* ---------- sincronização ---------- */
function startSync(){
 stopSync();
 const F=cloud.fb;
 setCloudState(navigator.onLine===false?'offline':'syncing');
 cloud.ready=false;cloud.metaReady=false;
 cloud.unsubMeta=F.onSnapshot(F.collection(cloud.db,'jogos'),snap=>{onMetaSnap(snap);if(!cloud.metaReady){cloud.metaReady=true;listenCurrent();}},onCloudError);
 cloud.tactReady=false;
 cloud.unsubTact=F.onSnapshot(F.collection(cloud.db,'taticas'),snap=>{onTactSnap(snap);if(!cloud.tactReady){cloud.tactReady=true;pushTactics()}},onCloudError);
}
function stopSync(){
 if(cloud.unsubMeta){cloud.unsubMeta();cloud.unsubMeta=null}
 if(cloud.unsubRecs){cloud.unsubRecs();cloud.unsubRecs=null}
 if(cloud.unsubTact){cloud.unsubTact();cloud.unsubTact=null}
 cloud.listenId=null;cloud.ready=false;cloud.metaReady=false;cloud.tactReady=false;clearTimeout(cloud.tactTimer);
 clearTimeout(cloud.pushTimer);
}
function onCloudError(e){
 console.warn('Erro Firestore',e);
 const code=e&&e.code;
 if(code==='permission-denied')setCloudState('error','A base de dados recusou o acesso. Confirma as regras do Firestore (o email nas regras tem de ser '+CLOUD_CFG.email+').');
 else if(code==='unavailable')setCloudState('offline');
 else setCloudState('error','Erro na sincronização ('+(code||'desconhecido')+'). Os dados continuam guardados neste dispositivo.');
}
function listenCurrent(){
 const F=cloud.fb,gid=DB.currentId,g=DB.games[gid];
 if(cloud.unsubRecs){cloud.unsubRecs();cloud.unsubRecs=null}
 cloud.listenId=gid;
 if(!g||g.demo){cloud.ready=true;pushAll();return}
 const S=syncState(),p=S.pull[gid];
 const col=F.collection(cloud.db,'jogos',gid,'registos');
 const q=p?F.query(col,F.where('upd','>',new F.Timestamp(p.s,p.n))):col;
 let first=true;
 cloud.unsubRecs=F.onSnapshot(q,snap=>{applyRecSnap(gid,snap.docChanges().map(c=>c.doc));if(first){first=false;cloud.ready=true;pushAll()}},onCloudError);
}
function applyRecSnap(gid,docs){
 const g=DB.games[gid];if(!g)return;
 const S=syncState();const synced=S.games[gid]=S.games[gid]||{};
 let changed=false,maxP=S.pull[gid]||null;
 docs.forEach(d=>{
  if(d.metadata&&d.metadata.hasPendingWrites)return;
  const data=d.data();const t=tsOf(data.upd);if(t&&tsGt(t,maxP))maxP=t;
  if(applyRecDoc(g,synced,d.id,data))changed=true;
 });
 if(maxP)S.pull[gid]=maxP;
 saveSync(S);
 if(changed){save(true);cloudRerender()}
 markSynced();
}
function onMetaSnap(snap){
 const S=syncState();let changed=false,removedCurrent=false;const toPull=[],arrived=[];const initial=!cloud.metaReady;
 snap.docChanges().forEach(c=>{
  const d=c.doc;if(d.metadata&&d.metadata.hasPendingWrites)return;
  const id=d.id,data=d.data();
  if(data.del){
   if(DB.games[id]&&!DB.games[id].demo){delete DB.games[id];changed=true;if(DB.currentId===id)removedCurrent=true}
   delete S.games[id];delete S.pushed[id];delete S.pull[id];return;
  }
  if(S.deleted.includes(id))return;
  let g=DB.games[id],isNew=false;
  if(!g){g=newGame();g.id=id;g.demo=false;DB.games[id]=g;isNew=true;changed=true;arrived.push(id)}
  const synced=S.games[id]=S.games[id]||{};
  if(applyMeta(g,synced,data))changed=true;
  if(isNew)S.pushed[id]=g.updated;
  const t=tsOf(data.upd);
  if(id!==DB.currentId&&(isNew||(t&&tsGt(t,S.pull[id]||null))))toPull.push(id);
 });
 if(removedCurrent){
  const rest=Object.values(DB.games).sort((a,b)=>b.updated-a.updated);
  if(rest.length)DB.currentId=rest[0].id;else{const n=newGame();DB.games[n.id]=n;DB.currentId=n.id}
  toast('O jogo aberto foi apagado noutro dispositivo','warn');
 }
 saveSync(S);
 // jogos novos da equipa: abrir sozinho se este dispositivo não tem jogo em curso, senão perguntar
 if(arrived.length&&!removedCurrent){
  const opened=tryAutoOpen(S,initial);
  if(opened){changed=true;const i=toPull.indexOf(DB.currentId);if(i>=0)toPull.splice(i,1)}
  else announceNewGames(arrived,initial);
 }
 if(changed){save(true);cloudRerender()}
 toPull.forEach(pullGame);
 if(removedCurrent&&cloud.metaReady)listenCurrent();
 markSynced();
}
/** jogo local sem nada registado e nunca sincronizado (ou jogo de exemplo) */
function isBlankLocal(g,S){
 return !!g&&(g.demo||(!S.games[g.id]&&!g.individual.length&&!g.collective.length&&!g.timer.events.length&&!g.exclLog.length));
}
function teamGames(S){return Object.values(DB.games).filter(x=>!x.demo&&S.games[x.id]).sort((a,b)=>(b.created||0)-(a.created||0))}
function gameLabel(g){return `${g.scpName||'SCP'} vs ${g.opponent||'Adversário'} (${fmtDate(g.date)})`}
function tryAutoOpen(S,initial){
 const cur=DB.games[DB.currentId];
 if(!isBlankLocal(cur,S))return false;
 const list=teamGames(S);if(!list.length)return false;
 const g=list[0];
 if(!initial&&Date.now()-(g.created||0)>24*3600e3)return false;
 if(cur&&!cur.demo)delete DB.games[cur.id];           // jogo vazio deste dispositivo: não fica a ocupar espaço
 DB.currentId=g.id;if(typeof resetLocalState==='function')resetLocalState();
 toast((initial?'Aberto o jogo mais recente da equipa: ':'Novo jogo da equipa aberto: ')+gameLabel(g));
 return true;
}
function announceNewGames(ids,initial){
 const recent=ids.map(id=>DB.games[id]).filter(g=>g&&g.id!==DB.currentId&&Date.now()-(g.created||0)<(initial?2:24)*3600e3)
  .sort((a,b)=>(b.created||0)-(a.created||0));
 if(!recent.length)return;
 const g=recent[0];
 if($('#modal-root').firstElementChild){toast('Novo jogo da equipa: '+gameLabel(g)+'. Abre-o em Início › Jogos guardados.');return}
 modal({title:'Novo jogo da equipa',body:`<p>Foi criado noutro dispositivo o jogo <b>${esc(gameLabel(g))}</b>.</p><p class="muted small">Abre-o aqui para registar no mesmo jogo que os outros dispositivos. Podes sempre mudar de jogo em Início › Jogos guardados.</p>`,
  actions:[{label:'Agora não',cls:'btn-ghost',value:false},{label:'Abrir este jogo',cls:'btn-primary',value:true}]})
 .then(ok=>{if(ok&&DB.games[g.id])openTeamGame(g.id)});
}
function openTeamGame(id){
 DB.currentId=id;if(typeof resetLocalState==='function')resetLocalState();
 save(true);rerender();toast('Jogo aberto: '+gameLabel(DB.games[id]));
}
async function pullGame(gid){
 const F=cloud.fb;if(!F||!cloud.user)return;
 const p=syncState().pull[gid];
 const col=F.collection(cloud.db,'jogos',gid,'registos');
 try{const snap=await F.getDocs(p?F.query(col,F.where('upd','>',new F.Timestamp(p.s,p.n))):col);applyRecSnap(gid,snap.docs)}
 catch(e){onCloudError(e)}
}
function cloudOnSave(){
 if(!cloud.user)return;
 if(cloud.metaReady&&cloud.listenId!==DB.currentId)listenCurrent();
 clearTimeout(cloud.pushTimer);cloud.pushTimer=setTimeout(pushAll,700);
}
/** chamado quando o utilizador apaga um jogo (apaga-o para toda a equipa) */
function cloudGameDeleted(id){
 const S=syncState();
 if(cloud.user&&S.games[id]){
  const F=cloud.fb;
  F.setDoc(F.doc(cloud.db,'jogos',id),{del:true,upd:F.serverTimestamp()},{merge:true}).catch(onCloudError);
 }
 delete S.games[id];delete S.pushed[id];delete S.pull[id];
 if(!S.deleted.includes(id))S.deleted.push(id);
 saveSync(S);
}
/** apagar os dados do dispositivo NÃO apaga nada na nuvem */
async function cloudForgetDevice(){
 stopSync();
 if(cloud.auth&&cloud.user){try{await cloud.fb.signOut(cloud.auth)}catch(e){}}
 try{localStorage.removeItem(SYNC_KEY)}catch(e){}
}
function pushAll(){
 if(!cloud.user||!cloud.ready)return;
 const S=syncState();let ops=0;
 Object.values(DB.games).forEach(g=>{
  if(g.demo||S.deleted.includes(g.id))return;
  if(S.pushed[g.id]===g.updated&&S.games[g.id])return;
  ops+=pushGame(g,S);
 });
 saveSync(S);
 if(ops)markPending();else markSynced();
}
function pushGame(g,S){
 const F=cloud.fb,synced=S.games[g.id]||{};
 const d=diffGame(g,synced);
 const writes=[];
 const base=F.doc(cloud.db,'jogos',g.id);
 if(d.meta)writes.push([base,{...d.meta,del:false,upd:F.serverTimestamp()},{merge:true}]);
 Object.entries(d.sets).forEach(([id,p])=>writes.push([F.doc(cloud.db,'jogos',g.id,'registos',id),{...p,del:false,upd:F.serverTimestamp()},null]));
 d.dels.forEach(id=>writes.push([F.doc(cloud.db,'jogos',g.id,'registos',id),{del:true,upd:F.serverTimestamp()},{merge:true}]));
 for(let i=0;i<writes.length;i+=450){
  const b=F.writeBatch(cloud.db);
  writes.slice(i,i+450).forEach(([ref,data,opt])=>opt?b.set(ref,data,opt):b.set(ref,data));
  cloud.inflight++;
  b.commit().then(()=>{cloud.inflight--;markSynced()}).catch(e=>{cloud.inflight--;onCloudError(e)});
 }
 S.games[g.id]=d.next;S.pushed[g.id]=g.updated;
 return writes.length;
}
function markPending(){if(cloud.user)setCloudState(navigator.onLine===false?'offline':'syncing')}
function markSynced(){
 if(!cloud.user||cloud.state==='error')return;
 if(navigator.onLine===false){setCloudState('offline');return}
 if(cloud.inflight>0||!cloud.ready){setCloudState('syncing');return}
 cloud.lastSync=Date.now();setCloudState('synced');
}
function cloudSyncNow(){
 if(!cloud.user){cloudLogin();return}
 if(cloud.state==='error')cloud.error='';
 setCloudState('syncing');
 const S=syncState();S.pushed={};saveSync(S);   // forçar comparação completa
 startSync();
}
/* Atualizar o ecrã quando chegam dados de outro dispositivo, sem apagar o que se está a preencher:
   nos ecrãs de registo só se redesenham as tabelas/contadores, não os formulários. */
const CLOUD_REFRESH={
 coletiva:()=>renderColRecords(),
 individual:()=>{renderIndForm();renderIndRecords()},
 tempo:()=>{const cp=$('#t-cp');if(!cp||cp.textContent!==G().period+' período'){renderTempo();return}renderTempoSub();renderTempoPlayers();renderTempoLog();updateTempoLive()},
 exclusoes:()=>{renderTeam('scp');renderTeam('opp');renderExLog()},
 taticas:()=>{}           // o quadro não depende dos dados do jogo
};
let cloudRerenderPending=false;
function cloudRerender(){
 updateHeader();
 if(cloudRerenderPending)return;
 const a=document.activeElement;
 if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='checkbox'&&a.closest('main')){   // a escrever: esperar
  cloudRerenderPending=true;a.addEventListener('blur',()=>{cloudRerenderPending=false;setTimeout(cloudRerender,50)},{once:true});
  return;
 }
 if($('#modal-root').firstElementChild){                                      // diálogo aberto: esperar que feche
  cloudRerenderPending=true;
  const iv=setInterval(()=>{if(!$('#modal-root').firstElementChild){clearInterval(iv);cloudRerenderPending=false;cloudRerender()}},400);
  return;
 }
 const f=CLOUD_REFRESH[currentView];
 if(f){try{f();return}catch(e){console.warn('Atualização parcial falhou',e)}}
 rerender();
}

/* ---------- táticas do Quadro Tático (documento inteiro; fica a última alteração) ---------- */
function onTactSnap(snap){
 const S=syncState(),m=loadTactics();let changed=false;
 snap.docChanges().forEach(c=>{
  const d=c.doc;if(d.metadata&&d.metadata.hasPendingWrites)return;
  const data=d.data(),id=d.id;
  if(data.del){if(m[id]){delete m[id];changed=true}delete S.tact[id];return}
  const remote=plain(stripCloud(data)),h=hashOf(remote);
  if(S.tact[id]===h)return;
  m[id]=remote;S.tact[id]=h;changed=true;
 });
 saveSync(S);
 if(changed){saveTactics(m,true);if(typeof tacticsRemoteUpdate==='function')tacticsRemoteUpdate()}
 markSynced();
}
function cloudTacticsChanged(){
 if(!cloud.user)return;
 clearTimeout(cloud.tactTimer);cloud.tactTimer=setTimeout(pushTactics,800);
}
function pushTactics(){
 if(!cloud.user||!cloud.tactReady)return;
 const F=cloud.fb,S=syncState(),m=loadTactics();let n=0;
 Object.values(m).forEach(t=>{
  const p=plain(t),h=hashOf(p);if(S.tact[t.id]===h)return;
  S.tact[t.id]=h;n++;cloud.inflight++;
  F.setDoc(F.doc(cloud.db,'taticas',t.id),{...p,del:false,upd:F.serverTimestamp()}).then(()=>{cloud.inflight--;markSynced()}).catch(e=>{cloud.inflight--;onCloudError(e)});
 });
 saveSync(S);if(n)markPending();
}
function cloudTacticDeleted(id){
 const S=syncState();
 if(cloud.user&&S.tact[id]){const F=cloud.fb;F.setDoc(F.doc(cloud.db,'taticas',id),{del:true,upd:F.serverTimestamp()},{merge:true}).catch(onCloudError)}
 delete S.tact[id];saveSync(S);
}

/* =========================================================
   TÁTICAS (Quadro Tático) — armazenamento local + sincronização com a equipa
   Cada tática: {id, name, cat, notes, view:'half'|'full', steps:[{pieces:[{id,t,n,x,y}], arrows:[{id,k,x1,y1,x2,y2}]}], created, updated}
   Coordenadas em metros: piscina de 30 m (x) por 20 m (y), baliza da direita em x=30.
   ========================================================= */
const TACT_KEY='scpStatPoloAquatico.taticas.v1';
const TACT_CATS=['Ataque','Defesa','Superioridade','Inferioridade','Contra-ataque','Bola parada','Outros'];
function loadTactics(){
 try{const m=JSON.parse(localStorage.getItem(TACT_KEY)||'{}');return m&&typeof m==='object'?m:{}}catch(e){return {}}
}
/** grava localmente; fromCloud=true quando a alteração veio da base de dados (não reenviar) */
function saveTactics(map,fromCloud){
 try{localStorage.setItem(TACT_KEY,JSON.stringify(map))}catch(e){toast('Não foi possível guardar a tática neste dispositivo.','bad')}
 if(!fromCloud&&typeof cloudTacticsChanged==='function')cloudTacticsChanged();
}
function importTactics(list){
 const m=loadTactics();
 list.forEach(t=>{if(t&&t.id&&Array.isArray(t.steps))m[t.id]={...t,updated:Date.now()}});
 saveTactics(m);
}
function deleteTactic(id){
 const m=loadTactics();delete m[id];saveTactics(m,true);
 if(typeof cloudTacticDeleted==='function')cloudTacticDeleted(id);
}

/* =========================================================
   EXPORTAR / IMPORTAR — dois botões para tudo:
   1) Exportar para Excel (.xlsx): uma folha por tabela, do jogo aberto ou de todos os jogos
   2) Cópia de segurança (.json): todos os jogos, definições e táticas; volta a entrar com "Importar"
   O .xlsx é gerado aqui mesmo (sem bibliotecas externas), por isso funciona sem internet.
   ========================================================= */

/* ---------- gerador de .xlsx (ZIP sem compressão + SpreadsheetML) ---------- */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
 const enc=new TextEncoder(),parts=[],central=[];let off=0;
 const d=new Date(),dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 files.forEach(f=>{
  const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dosT,true);h.setUint16(12,dosD,true);
  h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dosT,true);c.setUint16(14,dosD,true);
  c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);
  off+=30+name.length+data.length;
 });
 const cSize=central.reduce((a,p)=>a+p.length,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cSize,true);e.setUint32(16,off,true);
 const all=[...parts,...central,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((a,p)=>a+p.length,0));
 let p=0;all.forEach(x=>{out.set(x,p);p+=x.length});
 return out;
}
const xmlEsc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function sheetName(n,used){let s=String(n).replace(/[\[\]:*?\/\\]/g,'-').slice(0,31);let k=s,i=2;while(used.has(k)){k=s.slice(0,28)+' '+i++}used.add(k);return k}
/** sheets: [{name, rows:[[cabeçalho...], [valores...]...]}] -> Uint8Array (.xlsx) */
function makeXlsx(sheets){
 const used=new Set();sheets=sheets.map(s=>({...s,name:sheetName(s.name,used)}));
 const sheetXml=s=>{
  const rows=s.rows.length?s.rows:[['(sem dados)']],ncol=Math.max(...rows.map(r=>r.length),1);
  const widths=Array.from({length:ncol},(_,c)=>Math.min(50,Math.max(8,...rows.slice(0,400).map(r=>r[c]==null?0:String(r[c]).length+2))));
  const body=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
   if(v==null||v==='')return '';
   const ref=colName(ci)+(ri+1),st=ri===0?' s="1"':'';
   if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${st}><v>${v}</v></c>`;
   if(typeof v==='boolean')return `<c r="${ref}"${st} t="inlineStr"><is><t>${v?'Sim':''}</t></is></c>`;
   return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('')+'</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData>${rows.length>1?`<autoFilter ref="A1:${colName(ncol-1)}${rows.length}"/>`:''}</worksheet>`;
 };
 const defNames=sheets.map((s,i)=>s.rows.length>1?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(s.name).replace(/'/g,"''")}'!$A$1:$${colName(Math.max(...s.rows.map(r=>r.length))-1)}$${s.rows.length}</definedName>`:'').join('');
 const files=[
  {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
  {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${defNames?`<definedNames>${defNames}</definedNames>`:''}</workbook>`},
  {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
  {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF004D2A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
  ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s)}))
 ];
 return zipStore(files);
}

/* ---------- conteúdo das folhas (os mesmos dados que antes saíam em CSV separados) ---------- */
function withGame(g,fn){const keep=DB.currentId;DB.currentId=g.id;try{return fn()}finally{DB.currentId=keep}}
const xPname=(g,n)=>{const p=g.roster.find(x=>x.n===+n);return p&&p.name?p.name:'Jogador '+n};
const xEx=(g,t,n)=>((g.excl||{})[t]||{})[n]||{ex:0,red:false,goals:0};
const xScore=g=>{const s=t=>Object.values((g.excl||{})[t]||{}).reduce((a,x)=>a+(x.goals||0),0);return {scp:s('scp'),opp:s('opp')}};
const r1=v=>v==null?null:Math.round(v*10)/10;

const EXPORT_SHEETS=[
 {name:'Jogos',head:['Competição','Local','Golos SCP','Golos adversário','Duração do período (min)','Registos individuais','Ataques (coletiva)','Entradas/saídas','Bolas de saída ganhas'],

  rows:g=>g.individual.slice().sort((a,b)=>a.ts-b.ts).map(r=>[r.mode==='gk'?'GR':'Campo',r.period,r.player,xPname(g,r.player),r.action,r.sit,r.assist==='none'||r.assist===''?null:r.assist,r.assist==='none'?'Sem assistência':r.assist?xPname(g,r.assist):'',r.fzone,r.fy!=null?r1(r.fy*12.5):null,r.fx!=null?r1(r.fx*100):null,r.fy!=null?r1(r.fy*100):null,r.gzone,r.gx!=null?r1(r.gx*100):null,r.gy!=null?r1(r.gy*100):null,new Date(r.ts).toLocaleString('pt-PT')])},
 {name:'Coletiva',head:['Tabela','Período','Nº ataque','Jogada ofensiva','Jogada defensiva / Defesa','Sistema +1','Contra-ataque','Posição remate','Outcome','Tempo ATQ','Notas'],
  rows:g=>{const ord=Object.keys(COL_TABLE_TITLE);return g.collective.slice().sort((a,b)=>ord.indexOf(a.table)-ord.indexOf(b.table)||String(a.period).localeCompare(String(b.period))||(+a.attack)-(+b.attack))
   .map(r=>[COL_TABLE_TITLE[r.table]||r.table,r.period,+r.attack||r.attack,r.offense,r.defense,r.system,r.ca,r.position,r.outcome,r.timing,r.notes])}},
 {name:'Tempo – movimentos',head:['Período','Relógio','Nº','Jogador','Movimento'],
  rows:g=>withGame(g,()=>g.timer.events.slice().sort((a,b)=>absTime(a.period,a.clock)-absTime(b.period,b.clock)||a.seq-b.seq).map(e=>[e.period,fmtClock(e.clock),e.n,xPname(g,e.n),e.type==='in'?'Entrada':'Saída']))},
 {name:'Tempo – resumo',head:['Nº','Jogador','GR','Turnos','Último turno','Tempo total','Tempo total (s)'],
  rows:g=>withGame(g,()=>{const s=computeShifts();return g.roster.filter(p=>s[p.n].count||p.name).map(p=>{const x=s[p.n];return [p.n,xPname(g,p.n),p.gr?'Sim':'',x.count,x.count?fmtClock(x.last):'',fmtClock(x.total),Math.round(x.total)]})})},

function buildExportSheets(games){

function playerLine(game,n){
 const F=game.individual.filter(r=>r.mode==='field'&&r.player===n),K=game.individual.filter(r=>r.mode==='gk'&&r.player===n);
 const sh=F.filter(r=>SHOT_ACTS.includes(r.action)),gl=sh.filter(r=>r.action==='Golo').length,c=a=>F.filter(r=>r.action===a).length;
 const sv=K.filter(r=>r.action==='Defesa GR'||r.action==='Defesa p/ Fora GR').length,gs=K.filter(r=>r.action==='Golo Sofrido').length;
 return {shots:sh.length,goals:gl,ast:game.individual.filter(r=>r.mode==='field'&&r.assist===n).length,excW:c('EXC ganha'),excL:c('EXC sofrida'),lost:c('Perda Bola')+c('Passe Falhado')+c('Falta Atacante'),steal:c('Roubo Bola'),blk:c('Bloco Defensivo'),sv,gs,gkOn:sv+gs,F,K};
}
function findInGame(game,p){
 if(p.name){const m=game.roster.find(x=>norm(x.name)===norm(p.name));return m?m.n:null}
 return game.roster.find(x=>x.n===p.n)?p.n:null;
}

/* =========================================================
   GUARDA-REDES — rendimento dos GR do SCP (a partir da Estatística Individual)
   ========================================================= */
const grs={who:'',period:''};
const GR_SAVE=['Defesa GR','Defesa p/ Fora GR'];
const grOn=r=>r.action==='Golo Sofrido'||GR_SAVE.includes(r.action);
function grStats(rows){const on=rows.filter(grOn),sv=rows.filter(r=>GR_SAVE.includes(r.action)),gl=rows.filter(r=>r.action==='Golo Sofrido');return {n:rows.length,on:on.length,sv:sv.length,gl:gl.length,out:rows.filter(r=>r.action==='Fora').length,hold:rows.filter(r=>r.action==='Defesa GR').length,away:rows.filter(r=>r.action==='Defesa p/ Fora GR').length,p:pct(sv.length,on.length)}}
function renderGuardaRedes(){
 const g=G(),v=$('#view-guardaredes'),shifts=computeShifts();
 const gks=[...new Set([...g.roster.filter(p=>p.gr).map(p=>p.n),...g.individual.filter(r=>r.mode==='gk').map(r=>r.player)])].sort((a,b)=>a-b);
 const all=g.individual.filter(r=>r.mode==='gk'&&(!grs.period||r.period===grs.period));
 const rows=all.filter(r=>!grs.who||String(r.player)===grs.who),st=grStats(rows);
 const secs=grs.period?0:(grs.who?shifts[+grs.who]?.total||0:gks.reduce((a,n)=>a+(shifts[n]?.total||0),0));
 const pctBars=(keyFn,order)=>{const m=groupBy(rows.filter(grOn),keyFn);let items=[...m].map(([k,rs])=>{const s=grStats(rs);return {label:k,v:s.p,x:s}});if(order)items.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));return barsHTML(items,{max:100,fmt:i=>`${i.v}% <small>${i.x.sv}/${i.x.on}</small>`})};
 const byGoal=groupBy(rows.filter(grOn),'gzone');
 const sectors=GOAL_ZONES.filter(z=>byGoal.has(z)).map(z=>({z,...grStats(byGoal.get(z))}));
 const ins=[];
 const weak=sectors.filter(s=>s.on>=2).sort((a,b)=>a.p-b.p||b.gl-a.gl);

function addMove(n,type){const g=G();g.timer.seq=(g.timer.seq||0)+1;g.timer.events.push({id:uid(),n,type,period:g.period,clock:Math.round(clockNow()),seq:g.timer.seq,ts:Date.now()})}
function afterMove(){save();renderTempoPlayers();renderTempoLog();renderTempoSub()}
async function moveIn(n){
 const g=G(),s=computeShifts(),pool=Object.keys(s).map(Number).filter(k=>s[k].on),me=s[n];
 if(me.on){addMove(n,'out');if(tsub.out===n)tsub.out=null;afterMove();toast(`${plabel(n)} saiu · ${g.period} ${fmtClock(clockNow())}`);return}
 if(pool.length>=maxPool()){
  const out=await modal({title:`Entra ${plabel(n)}: quem sai?`,body:`<p>Estão ${pool.length} jogadores na água. Escolhe quem sai — a saída e a entrada ficam registadas no mesmo instante (${g.period} ${fmtClock(clockNow())}).</p>`,
   actions:[...pool.map(k=>({label:plabel(k)+(player(k).gr?' (GR)':''),cls:'btn-outline',value:k})),{label:'Cancelar',cls:'btn-ghost',value:null}]});
  if(out==null)return;doSub(out,n);return}
 addMove(n,'in');if(tsub.in===n)tsub.in=null;afterMove();toast(`${plabel(n)} entrou · ${g.period} ${fmtClock(clockNow())}`);
}
function doSub(out,inn){
 const s=computeShifts();
 if(out==null||inn==null){toast('Escolhe quem sai e quem entra.','warn');return}
 if(!s[out].on){toast(`${plabel(out)} não está na água.`,'warn');return}
 if(s[inn].on){toast(`${plabel(inn)} já está na água.`,'warn');return}
 addMove(out,'out');addMove(inn,'in');tsub.out=null;tsub.in=null;afterMove();
 toast(`Substituição: sai ${plabel(out)}, entra ${plabel(inn)} · ${G().period} ${fmtClock(clockNow())}`);
}

   <div><span class="lbl sub-lbl in">Entra · banco</span><div class="chips">${bench.map(p=>chip('in',p)).join('')}</div></div>

}

function updateTempoLive(){
 const g=G(),t=g.timer,c=$('#t-clock');if(!c)return;
 const now=clockNow(),s=computeShifts(),on=Object.values(s).filter(x=>x.on).length;
 c.textContent=fmtClock(now);c.classList.toggle('running',t.running);
 const pb=$('#t-play');if(pb)pb.innerHTML=t.running?icon('pause')+'Pausa':icon('play')+'Iniciar';
 const i=PERIODS.indexOf(g.period),nx=$('#t-next');
 if(nx){nx.hidden=!(now<=0&&i<PERIODS.length-1);nx.innerHTML=`Começar o ${PERIODS[i+1]||''} período`}
 const note=$('#t-note');
 if(note){note.textContent=now<=0?(i<PERIODS.length-1?`Fim do ${g.period} período.`:'Fim do jogo.'):(!t.running&&on?'Relógio parado: o tempo dos jogadores não está a contar.':'');note.hidden=!note.textContent}
 const el=$('#t-on');if(el){el.textContent=on;el.classList.toggle('full',on>=maxPool())}
 const sig=Object.keys(s).filter(k=>s[k].on).join(',')+'|'+(on>=maxPool());
 if(sig!==lastPoolSig&&$('#t-players tr[data-row]')){lastPoolSig=sig;renderTempoPlayers();renderTempoSub();return}
 lastPoolSig=sig;
 const max=Math.max(1,nowAbs());
 $$('#t-players tr[data-row]').forEach(tr=>{const x=s[+tr.dataset.row];if(!x)return;
  const l=tr.querySelector('[data-k="last"]');if(l)l.innerHTML=x.count?fmtClock(x.last)+(x.on?(x.ahead?' <small class="muted">(entrou mais tarde no jogo)</small>':' <small class="muted">(atual)</small>'):''):'—';
  const tt=tr.querySelector('[data-k="total"]');if(tt)tt.innerHTML='<b>'+fmtClock(x.total)+'</b>';
  const cn=tr.querySelector('[data-k="count"]');if(cn)cn.textContent=x.count;
  const b=tr.querySelector('[data-k="bar"]');if(b)b.style.width=Math.min(100,x.total*100/max)+'%'});
}
