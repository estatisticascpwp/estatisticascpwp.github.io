<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004d2a">
<title>SCP Stat Polo Aquático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">

<style>
/* Layout: header verde fixo com navegação por ícones (como o mockup), painéis brancos sobre fundo verde-acinzentado; módulos em grelhas que passam a 1 coluna no telemóvel. */
:root{
  --green:#006633; --deep:#004d2a; --green2:#0d7d45; --yellow:#fcd116; --yellow2:#e9bf00;
  --ink:#102b24; --muted:#5a706a; --line:#d5dfdb; --soft:#e9efed; --bg:#edf2f0; --panel:#ffffff;
  --pool:#2a7db5; --pool2:#22689a; --red:#d93232; --okbg:#d6f2de; --ok:#0d6b33;
  --warnbg:#fff3c4; --warn:#6b5100; --badbg:#fde0df; --bad:#b21f1f; --neutral:#e7ecec;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.topbar{position:relative;z-index:30;background:linear-gradient(100deg,var(--deep),var(--green) 55%,#08783f);color:#fff;box-shadow:0 2px 12px rgba(0,40,20,.25)}
.topbar-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.crest{width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font:800 15px/1 var(--f-display);letter-spacing:.5px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px)}
.brand strong{display:block;font:800 23px/1 var(--f-display);letter-spacing:.5px}
.brand small{display:block;font:600 12px/1 var(--f-display);letter-spacing:2.6px;margin-top:4px;opacity:.92}
.nav{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav a,.hdr-settings a{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-decoration:none;padding:8px 8px;border-radius:9px;font:700 13px/1.05 var(--f-display);letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}
.nav a .ic,.hdr-settings a .ic{width:21px;height:21px}
.nav a:hover,.hdr-settings a:hover{background:rgba(255,255,255,.12)}
.nav a.active,.hdr-settings a.active{background:var(--yellow);color:#0b2e1d;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.hdr-right{display:flex;align-items:center;gap:12px;flex:none}
.hdr-game{font-size:13px;line-height:1.2;text-align:right}
.hdr-game b{font-family:var(--f-display);font-size:16px;letter-spacing:.3px}
.hdr-game .hg-sub{display:block;opacity:.85;font-size:12px}
.seg-period{display:flex;background:rgba(0,0,0,.2);border-radius:10px;padding:3px;gap:2px}
.seg-period button{border:0;background:transparent;color:#fff;font:700 15px/1 var(--f-display);padding:8px 10px;border-radius:7px;min-width:38px}
.seg-period button.on{background:var(--yellow);color:#0b2e1d}
@media (max-width:1700px){.hdr-game{display:none}}
@media (max-width:1560px){.topbar-in{flex-wrap:wrap;row-gap:4px}.nav{order:3;flex-basis:100%;justify-content:flex-start}.hdr-right{margin-left:auto}}
@media (max-width:560px){.brand strong{font-size:20px}.crest{width:40px;height:40px}.hdr-settings a span{display:none}.seg-period button{min-width:32px;padding:8px 7px}}

.demo-banner{background:var(--yellow);color:#2c2300}
.db-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px}

/* ---------- Main ---------- */
main{max-width:1600px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--panel);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 var(--line),0 6px 22px rgba(16,60,45,.06);min-width:0}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.title{margin:0;font:800 clamp(28px,3.2vw,40px)/1 var(--f-display);color:var(--green);text-transform:uppercase;letter-spacing:.3px}
.view-head p,.lead{margin:6px 0 0;color:var(--muted);max-width:68ch}
h2.sub{margin:0;font:800 24px/1.1 var(--f-display);color:var(--deep);letter-spacing:.2px}
h3.mini{margin:0 0 10px;font:700 15px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.eyebrow{margin:0 0 6px;font:700 13px var(--f-display);letter-spacing:2px;text-transform:uppercase;color:var(--green2)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:9px;font-weight:700;font-size:14px;min-height:42px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--yellow);border-color:var(--yellow2);color:#13331f}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-outline{border-color:var(--green);color:var(--green)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{background:var(--soft);border-color:transparent}
.btn-sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:#28443c}
.field select,.field input,.field textarea,.inp{width:100%;min-width:0;border:1px solid #c7d5cf;border-radius:8px;padding:9px 11px;background:#fff;min-height:42px}
.field textarea{resize:vertical;min-height:42px}
.inp-sm{min-height:34px;padding:5px 8px;border:1px solid #c7d5cf;border-radius:7px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#f4f7f6;padding:9px 12px;border-radius:8px;font-weight:700;font-size:14px;min-height:40px}
.chip.on{background:var(--green2);color:#fff;border-color:var(--green2)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:7px;font:700 16px var(--f-display);letter-spacing:.3px;min-height:40px}
.seg button.on{background:var(--green);color:#fff}
.mode-switch{display:inline-flex;background:var(--soft);padding:4px;border-radius:10px;gap:4px}
.mode-switch button{border:0;background:transparent;padding:9px 14px;border-radius:7px;font-weight:700;font-size:14px}
.mode-switch button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--green)}
.mode-switch button.on.gk{color:var(--red)}
.warnbox{background:#fff6d6;border:1px solid #efd067;color:#5d4600;padding:10px 12px;border-radius:9px;font-size:14px;margin-top:12px}
.warnbox b{color:#3e2f00}

/* ---------- Tabs (coletiva) ---------- */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:0}
.tab{border:0;background:#e7edeb;color:#153a32;padding:13px 8px;border-radius:10px 10px 0 0;font:700 16px/1.1 var(--f-display);letter-spacing:.2px}
.tab small{display:block;font-size:12px;opacity:.65;letter-spacing:1px}
.tab.on{background:var(--yellow);color:#073c26}
.form-grid{border:1px solid var(--line);border-radius:0 0 12px 12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;background:#fbfcfc}
.field.wide{grid-column:span 2}
.timing{display:flex;gap:6px}
.timing button{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;background:#eef1f2;font-weight:800;min-height:42px}
.timing button.on{background:var(--green2);border-color:var(--green2);color:#fff}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
@media (max-width:1050px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.tab{border-radius:10px}.form-grid{border-radius:12px;margin-top:8px}}
@media (max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.field.wide{grid-column:1/-1}.form-actions>*{flex:1}}

/* combobox pesquisável */
.combo{position:relative}
.combo input{padding-right:30px}
.combo .chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.combo-list{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:#fff;border:1px solid #c7d5cf;border-radius:9px;box-shadow:0 10px 24px rgba(10,40,30,.16);max-height:260px;overflow:auto}
.combo-list li{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.combo-list li.on,.combo-list li:hover{background:#e3f4ea}
.combo-list li.none{color:var(--muted);cursor:default;background:none}
.combo-list mark{background:#fff0a5;color:inherit;border-radius:2px}

/* ---------- Records ---------- */
.rec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.filters .field{min-width:130px;flex:1 1 150px}
.filters .field label{font-size:12px}
.filters select{min-height:38px;padding:6px 9px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--deep);color:#fff;padding:10px 9px;text-align:center;white-space:nowrap;font-weight:700;font-size:12.5px;letter-spacing:.3px}
td{border-top:1px solid #dde5e2;padding:8px 9px;text-align:center;font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left}
tbody tr:nth-child(even){background:#f6f9f8}
tbody tr:hover{background:#eaf5ef}
.count{color:var(--muted);font-size:13px;margin:10px 2px 0}
.empty{padding:22px;color:#6f8380}
.rowbtn{border:0;border-radius:6px;width:32px;height:30px;display:inline-grid;place-items:center;margin:0 2px;background:var(--green2);color:#fff}
.rowbtn.del{background:var(--red)}
.rowbtn .ic{width:15px;height:15px}
.badge{display:inline-block;padding:4px 9px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.3px;min-width:84px;white-space:nowrap}
.t-good{background:#c8f0d5;color:#075b2d}.t-bad{background:#ffe0df;color:#b21f1f}.t-warn{background:#fff0a5;color:#6b5100}.t-neutral{background:var(--neutral);color:#3e5552}
.act-cell{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.shape{width:14px;height:14px;flex:none;overflow:visible}
.sumstrip{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:#f3f7f5;border-radius:10px;font-size:14px}
.sumstrip b{font:800 22px/1 var(--f-display);color:var(--deep);margin-right:4px}

/* ---------- Home ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(115deg,#ffffff 0 55%,#e9f5ee)}
.home-hero .title{font-size:clamp(40px,5vw,64px)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--deep);color:#fff;border-radius:14px;padding:16px 18px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.sb-team span{font:700 14px/1.1 var(--f-display);letter-spacing:1px;text-transform:uppercase;opacity:.9;overflow-wrap:anywhere}
.sb-team b{font:800 54px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sb-mid{text-align:center;font:700 13px var(--f-display);letter-spacing:1.5px;text-transform:uppercase}
.sb-mid small{display:block;font:800 22px var(--f-display);color:var(--yellow);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.game-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.prog-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.prog{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:#fff}
.prog:hover{border-color:var(--green2);background:#f4faf6}
.prog .pi{width:44px;height:44px;border-radius:10px;background:#e3f2e9;color:var(--green);display:grid;place-items:center}
.prog .pi .ic{width:22px;height:22px}
.prog b{font:800 19px/1.1 var(--f-display);letter-spacing:.3px;color:var(--deep);text-transform:uppercase}
.prog p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.prog .pc{font:800 22px/1 var(--f-display);color:var(--deep);text-align:right}
.prog .pc small{display:block;font:600 11px var(--f-body);color:var(--muted);letter-spacing:.5px}
.sprint-row{display:grid;grid-template-columns:48px auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sprint-row:first-of-type{border-top:0}
.sprint-row .pn{font:800 20px var(--f-display);color:var(--deep)}
.sprint-row .chip{padding:7px 11px;min-height:36px}
.chip.on.opp{background:#5b6b68;border-color:#5b6b68}
.store-list{margin:8px 0 0;padding-left:18px;color:#33504a;font-size:14px}
.store-list li{margin:4px 0}
.cur-pill{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
@media (max-width:900px){.home-hero,.home-grid{grid-template-columns:1fr}.prog{grid-template-columns:40px minmax(0,1fr) auto}.prog .btn{display:none}}

/* ---------- Individual ---------- */
.ind-layout{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(320px,1.5fr) minmax(250px,1fr);grid-template-areas:"a b c";gap:16px;align-items:start}
.ind-a{grid-area:a}.ind-b{grid-area:b}.ind-c{grid-area:c}
.ind-a,.ind-b,.ind-c{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.ind-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"a b" "c b"}}
@media (max-width:760px){.ind-layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c"}}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfc}
.step-h{display:flex;align-items:center;gap:8px;font:700 16px var(--f-display);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;color:#1e3d35}
.step-h .opt{margin-left:auto;font:600 12px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.step-n.done{background:var(--yellow);color:#0b2e1d}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.cap{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;min-width:0;min-height:42px}
.cap .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e4ece9;color:var(--deep);font:800 15px var(--f-display);flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #c9d6d1}
.cap.gk .num{background:#fbe1df;color:#b21f1f}
.cap .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cap.on{border-color:var(--green);background:#e6f5ec;box-shadow:inset 0 0 0 1px var(--green)}
.cap.on .num{background:var(--green);color:#fff}
.cap.gk.on{border-color:var(--red);background:#fdeceb;box-shadow:inset 0 0 0 1px var(--red)}
.cap.gk.on .num{background:var(--red);color:#fff}
.cap.dim{opacity:.4}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.act{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:13.5px;text-align:left;min-height:42px;min-width:0}
.act span{min-width:0;overflow-wrap:anywhere}
.act.on{background:#123d2e;color:#fff;border-color:#123d2e}
.pitch-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f7faf9}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pc-h b{font:700 16px var(--f-display);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.zone-tag{font:700 14px var(--f-display);letter-spacing:.3px;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--muted)}
.zone-tag.set{background:var(--green);border-color:var(--green);color:#fff}
.court{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:2/1;border-radius:8px;cursor:crosshair;touch-action:manipulation;user-select:none}
.pitch-card.na .court{opacity:.35;cursor:not-allowed}
.pitch-card .na-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.court text{font-family:var(--f-display);font-weight:700;pointer-events:none}
.mk{transition:transform .15s}
.mk.hl{transform-box:fill-box;transform-origin:center;transform:scale(1.9)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:#33504a}
.legend span{display:inline-flex;align-items:center;gap:5px}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:700}
.req.ok{background:var(--okbg);color:var(--ok)}
.editing-note{background:#e3f0fb;color:#1d4f7a;border-radius:9px;padding:8px 11px;font-size:13.5px}

/* ---------- Tempo ---------- */
.clock-panel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,.7fr);gap:14px;align-items:stretch}
.clock-box{background:var(--deep);color:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clock-box .cp{font:700 14px var(--f-display);letter-spacing:2px;text-transform:uppercase;opacity:.85}
.clock{font:800 72px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock.running{color:var(--yellow)}
.clock-box .btn-row .btn{min-width:0}
.clock-box .btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.clock-set{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.clock-set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clock-set select{min-height:42px;border:1px solid #c7d5cf;border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}
.onfield{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.onfield b{font:800 64px/1 var(--f-display);color:var(--green);font-variant-numeric:tabular-nums}
.onfield b.full{color:var(--red)}
.onfield span{font:700 15px var(--f-display);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
@media (max-width:980px){.clock-panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.onfield{grid-column:1/-1;flex-direction:row;gap:10px}}
@media (max-width:600px){.clock-panel{grid-template-columns:minmax(0,1fr)}.clock{font-size:60px}}

<script>
(()=>{'use strict';
/* =========================================================
   SCP STAT — POLO AQUÁTICO · núcleo (utilitários, armazenamento, navegação)
   ========================================================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function fmtClock(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function parseClock(str){const m=String(str??'').trim().match(/^(\d{1,2})(?:\s*[:.,'h]\s*(\d{1,2}))?$/);if(!m)return null;const sec=+(m[2]||0);if(sec>59)return null;return +m[1]*60+sec}
function fmtDate(iso){if(!iso)return '';const p=String(iso).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso}
function numPT(v,dec=1){return v==null||v===''?'':String(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).replace('.',',')}
function parseNum(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}

const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 goal:'<path d="M3 19V6h18v13"/><path d="M3 6l3 4h12l3-4M6 10v9M18 10v9M10 10v9M14 10v9"/>',

};

/* ---------- Modelo de dados ---------- */
const DEFAULT_SETTINGS={teamName:'Sporting CP',periodLength:480,maxInPool:7,assistRequired:true,autoAttack:true,resetClockOnPeriod:true};
const S=()=>(typeof DB!=='undefined'&&DB.settings)||DEFAULT_SETTINGS;
const POSITIONS=['Guarda-redes','Pivot','Defesa-pivot','Ponta','Lateral','Central','Universal'];
function defaultRoster(){return Array.from({length:15},(_,i)=>({n:i+1,name:'',gr:i===0||i===12,pos:i===0||i===12?'Guarda-redes':'',hand:''}))}
function defaultOpp(){return Array.from({length:13},(_,i)=>({n:i+1,name:''}))}
function newGame(base,opts={}){
 const L=S().periodLength||480;
 return {
  id:uid(), scpName:S().teamName||'Sporting CP', opponent:'Adversário', date:todayISO(), competition:'', venue:'',
  period:'1º', periodLength:L,
  roster: base&&opts.keepRoster? base.roster.map(p=>({...p})) : defaultRoster(),
  oppRoster: defaultOpp(),
  individual:[], collective:[],
  timer:{events:[], remaining:L, running:false, startedAt:0, seq:0},

}
function normalizeGame(g){
 const b=newGame();
 for(const k of Object.keys(b)) if(g[k]===undefined||g[k]===null) g[k]=b[k];
 const r=defaultRoster(); (Array.isArray(g.roster)?g.roster:[]).forEach(p=>{if(p&&p.n>=1&&p.n<=15)r[p.n-1]={...r[p.n-1],...p}}); g.roster=r;
 const o=defaultOpp(); (Array.isArray(g.oppRoster)?g.oppRoster:[]).forEach(p=>{if(p&&p.n>=1&&p.n<=13)o[p.n-1]={...o[p.n-1],...p}}); g.oppRoster=o;

  const back=root.firstElementChild;

/* ---------- CSV / ficheiros ---------- */
function csvCell(v){v=v==null?'':String(v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function download(name,text,type='text/csv;charset=utf-8'){
 const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 toast('Ficheiro exportado: '+name);
}
function parseCSV(text){
 text=String(text).replace(/^﻿/,'');
 const first=text.split(/\r?\n/)[0]||'';
 const sep=first.split(';').length>=first.split(',').length?';':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true; else if(c===sep){row.push(f);f=''} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r')f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function csvObjects(text){const rows=parseCSV(text);if(rows.length<2)return [];const h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()])))}
function pickFile(accept){
 return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept=accept;
  inp.onchange=()=>{const f=inp.files[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>res({name:f.name,text:String(r.result)});r.onerror=()=>res(null);r.readAsText(f,'utf-8')};
  inp.click()});
}

function bindCombo(root,opts){
 const inp=root.querySelector('input'),list=root.querySelector('ul');let items=[],idx=0,typed=false;
 const hl=o=>{const q=norm(inp.value);if(!typed||!q)return esc(o);const i=norm(o).indexOf(q);return i<0?esc(o):esc(o.slice(0,i))+'<mark>'+esc(o.slice(i,i+q.length))+'</mark>'+esc(o.slice(i+q.length))};
 const show=()=>{const q=norm(inp.value);items=typed&&q?opts.filter(o=>norm(o).includes(q)):opts.slice();if(idx>=items.length)idx=0;
  list.innerHTML=items.length?items.map((o,i)=>`<li role="option" data-v="${esc(o)}" class="${i===idx?'on':''}">${hl(o)}</li>`).join(''):'<li class="none">Sem resultados</li>';list.hidden=false;inp.setAttribute('aria-expanded','true');
  const on=list.querySelector('li.on');if(on)on.scrollIntoView({block:'nearest'})};
 const hide=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false')};
 const choose=v=>{inp.value=v;typed=false;hide();inp.dispatchEvent(new Event('change',{bubbles:true}))};
 inp.addEventListener('focus',()=>{typed=false;idx=Math.max(0,opts.indexOf(inp.value));show();inp.select()});
 inp.addEventListener('input',()=>{typed=true;idx=0;show()});
 inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(list.hidden)show();idx=Math.min(items.length-1,idx+1);show()}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(0,idx-1);show()}
  else if(e.key==='Enter'){if(!list.hidden&&items[idx]){e.preventDefault();choose(items[idx])}}
  else if(e.key==='Escape'){hide()}
  else if(e.key==='Tab'){if(!list.hidden&&typed&&items[idx])choose(items[idx])}});
 list.addEventListener('mousedown',e=>{e.preventDefault();const li=e.target.closest('li[data-v]');if(li)choose(li.dataset.v)});
 inp.addEventListener('blur',()=>{setTimeout(()=>{hide();if(inp.value&&!opts.includes(inp.value)){const m=opts.find(o=>norm(o)===norm(inp.value))||(items.length===1?items[0]:null);inp.value=m||'';if(!m)toast('Escolhe uma opção da lista.','warn')}typed=false},120)});
}

function clockNow(){const t=G().timer;if(!t.running)return t.remaining;return Math.max(0,t.remaining-(Date.now()-t.startedAt)/1000)}
function absTime(period,clock){const L=G().periodLength;return Math.max(0,PERIODS.indexOf(period))*L+(L-clock)}
function nowAbs(){return absTime(G().period,clockNow())}
/* Quem está na água: decidido pela ORDEM em que os movimentos foram registados (seq),
   não pelo relógio — assim mudar de período ou acertar o relógio nunca baralha o estado.
   A duração de cada turno vem do período + relógio de cada movimento. */
function computeShifts(){
 const g=G(),ev=g.timer.events.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)||(a.ts||0)-(b.ts||0));
 const res={},issues=new Set();g.roster.forEach(p=>res[p.n]={inSince:null,inEv:null,shifts:[],closed:0});
 ev.forEach(e=>{const s=res[e.n];if(!s)return;const t=absTime(e.period,e.clock);
  if(e.type==='in'){if(s.inSince==null){s.inSince=t;s.inEv=e.id}else issues.add(e.id)}
  else if(s.inSince!=null){const raw=t-s.inSince;if(raw<0){issues.add(e.id);issues.add(s.inEv)}const d=Math.max(0,raw);s.shifts.push({from:s.inSince,to:t,dur:d});s.closed+=d;s.inSince=null;s.inEv=null}
  else issues.add(e.id)});
 const now=nowAbs();
 Object.values(res).forEach(s=>{s.on=s.inSince!=null;s.ahead=s.on&&now<s.inSince;s.open=s.on?Math.max(0,now-s.inSince):0;s.total=s.closed+s.open;s.count=s.shifts.length+(s.on?1:0);s.last=s.on?s.open:(s.shifts.length?s.shifts[s.shifts.length-1].dur:0)});
 computeShifts.issues=issues;
 return res;
}

function initPWA(){
 document.addEventListener('click',e=>{if(e.target.closest('[data-install]'))promptInstall()});
 const hb=$('#hdr-install');if(hb)hb.onclick=promptInstall;
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pwa.deferred=e;updateInstallUI()});
 window.addEventListener('appinstalled',()=>{pwa.deferred=null;updateInstallUI();toast('SCP Stat instalada')});
 if(isStandalone())document.documentElement.classList.add('standalone');
 if(!canPWA()){updateInstallUI();return}
 /* recarregar só quando uma versão nova substitui a anterior (não na primeira instalação) */
 const hadController=!!navigator.serviceWorker.controller;let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;location.reload()});
 navigator.serviceWorker.register('sw.js').then(reg=>{
  pwa.reg=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBar();
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateBar()})});
  setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
 }).catch(err=>console.warn('Service worker não registado',err));
 /* pedir ao browser para não apagar os dados guardados quando houver pouco espaço */
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist()}).catch(()=>{});
 updateInstallUI();
}

function playerLine(game,n){
 const F=game.individual.filter(r=>r.mode==='field'&&r.player===n),K=game.individual.filter(r=>r.mode==='gk'&&r.player===n);
 const sh=F.filter(r=>SHOT_ACTS.includes(r.action)),gl=sh.filter(r=>r.action==='Golo').length,c=a=>F.filter(r=>r.action===a).length;
 const sv=K.filter(r=>r.action==='Defesa GR'||r.action==='Defesa p/ Fora GR').length,gs=K.filter(r=>r.action==='Golo Sofrido').length;
 return {shots:sh.length,goals:gl,ast:game.individual.filter(r=>r.mode==='field'&&r.assist===n).length,excW:c('EXC ganha'),excL:c('EXC sofrida'),lost:c('Perda Bola')+c('Passe Falhado')+c('Falta Atacante'),steal:c('Roubo Bola'),blk:c('Bloco Defensivo'),sv,gs,gkOn:sv+gs,F,K};
}
function findInGame(game,p){
 if(p.name){const m=game.roster.find(x=>norm(x.name)===norm(p.name));return m?m.n:null}
 return game.roster.find(x=>x.n===p.n)?p.n:null;
}

/* =========================================================
   GUARDA-REDES — rendimento dos GR do SCP (a partir da Estatística Individual)
   ========================================================= */
const grs={who:'',period:''};
const GR_SAVE=['Defesa GR','Defesa p/ Fora GR'];
const grOn=r=>r.action==='Golo Sofrido'||GR_SAVE.includes(r.action);
function grStats(rows){const on=rows.filter(grOn),sv=rows.filter(r=>GR_SAVE.includes(r.action)),gl=rows.filter(r=>r.action==='Golo Sofrido');return {n:rows.length,on:on.length,sv:sv.length,gl:gl.length,out:rows.filter(r=>r.action==='Fora').length,hold:rows.filter(r=>r.action==='Defesa GR').length,away:rows.filter(r=>r.action==='Defesa p/ Fora GR').length,p:pct(sv.length,on.length)}}
function renderGuardaRedes(){
 const g=G(),v=$('#view-guardaredes'),shifts=computeShifts();
 const gks=[...new Set([...g.roster.filter(p=>p.gr).map(p=>p.n),...g.individual.filter(r=>r.mode==='gk').map(r=>r.player)])].sort((a,b)=>a-b);
 const all=g.individual.filter(r=>r.mode==='gk'&&(!grs.period||r.period===grs.period));
 const rows=all.filter(r=>!grs.who||String(r.player)===grs.who),st=grStats(rows);
 const secs=grs.period?0:(grs.who?shifts[+grs.who]?.total||0:gks.reduce((a,n)=>a+(shifts[n]?.total||0),0));
 const pctBars=(keyFn,order)=>{const m=groupBy(rows.filter(grOn),keyFn);let items=[...m].map(([k,rs])=>{const s=grStats(rs);return {label:k,v:s.p,x:s}});if(order)items.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));return barsHTML(items,{max:100,fmt:i=>`${i.v}% <small>${i.x.sv}/${i.x.on}</small>`})};
 const byGoal=groupBy(rows.filter(grOn),'gzone');
 const sectors=GOAL_ZONES.filter(z=>byGoal.has(z)).map(z=>({z,...grStats(byGoal.get(z))}));
 const ins=[];
 const weak=sectors.filter(s=>s.on>=2).sort((a,b)=>a.p-b.p||b.gl-a.gl);
 if(weak.length){ins.push(['bad','Zona mais batida',`${weak[0].z}: ${weak[0].gl} golo(s) em ${weak[0].on} remates à baliza (${weak[0].p}% de defesas).`]);if(weak.length>1&&weak[weak.length-1].p>weak[0].p)ins.push(['good','Zona mais segura',`${weak[weak.length-1].z}: ${weak[weak.length-1].p}% de defesas (${weak[weak.length-1].sv}/${weak[weak.length-1].on}).`])}
 const near=rows.filter(r=>grOn(r)&&r.fy!=null&&r.fy*12.5<6),far=rows.filter(r=>grOn(r)&&r.fy!=null&&r.fy*12.5>=6);
 if(near.length>=2&&far.length>=2){const a=grStats(near).p,b=grStats(far).p;ins.push([b>=a?'info':'bad','Perto vs. longe',`Remates de dentro dos 6M: ${a}% de defesas (${near.length}). De fora dos 6M: ${b}% (${far.length}).${b<50?' Os remates de longe estão a entrar demasiado.':''}`])}
 const pen=grStats(rows.filter(r=>r.sit==='PEN'));if(pen.on)ins.push([pen.sv?'good':'info','Penáltis',`${pen.sv} defesa(s) em ${pen.on} penálti(s).`]);
 if(st.away+st.hold>=3)ins.push(['info','Tipo de defesa',`${st.hold} defesas com a bola controlada e ${st.away} para fora (${pct(st.away,st.sv)}% das defesas dão nova posse ou canto ao adversário).`]);
 v.innerHTML=`
 <section class="panel">
  <div class="view-head"><div><h1 class="title">Guarda-Redes</h1><p>Rendimento dos guarda-redes do SCP a partir dos registos de GR da Estatística Individual (golos sofridos, defesas e remates para fora).</p></div>
   <div class="field" style="min-width:150px"><label for="gr-p">Período</label><select id="gr-p"><option value="">Jogo todo</option>${PERIODS.map(p=>`<option ${grs.period===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
  <div class="gk-chips" id="gr-who"><button type="button" class="chip ${grs.who?'':'on'}" data-who="">Todos os GR</button>${gks.map(n=>`<button type="button" class="cap gk ${grs.who===String(n)?'on':''}" data-who="${n}" style="min-width:150px"><span class="num">${n}</span><span class="nm">${esc(pname(n))}</span></button>`).join('')}</div>
  <div class="prof" style="margin-top:14px">
   <span class="bigcap gk">${grs.who||'GR'}</span>
   <div><h2>${esc(grs.who?pname(grs.who):'Todos os guarda-redes')}</h2><p>${grs.period?grs.period+' período':'Jogo todo'} · ${secs?fmtClock(secs)+' na água':'sem tempo de jogo registado'}</p></div>
   <div class="pmeta"><div><b>${st.on?st.p+'%':'—'}</b><span>% defesas</span></div><div><b>${st.sv}</b><span>defesas</span></div><div><b>${st.gl}</b><span>golos sofridos</span></div><div><b>${st.on}</b><span>remates à baliza</span></div><div><b>${secs>=60?numPT(st.gl*480/secs):'—'}</b><span>golos / 8'</span></div></div>
  </div>
 </section>
 ${ins.length?`<section class="panel"><h2 class="sub">Leituras</h2><div class="insights" style="margin-top:12px">${ins.map(([t,h,p])=>`<div class="ins ${t}"><span class="dot">${t==='good'?'↑':t==='bad'?'!':'i'}</span><div><b>${esc(h)}</b><p>${esc(p)}</p></div></div>`).join('')}</div></section>`:''}
 <div class="two-maps">
  <section class="panel"><div class="pc-h"><h3 class="mini" style="margin:0">Remates à baliza — onde chegaram</h3></div>${goalMarkup('grgoal')}
   <div class="legend">${ACTIONS.gk.map(a=>`<span>${actIcon(a)}${esc(a.id)}</span>`).join('')}</div>
   <div class="table-wrap" style="margin-top:12px"><table class="mx"><thead><tr><th class="zl">Zona da baliza</th><th>À baliza</th><th>Defesas</th><th>Golos</th><th>% defesas</th></tr></thead><tbody>
   ${sectors.map(s=>`<tr><td class="zl">${esc(s.z)}</td><td>${s.on}</td><td>${s.sv}</td><td>${s.gl}</td><td><span class="badge ${s.p>=60?'t-good':s.p>=40?'t-warn':'t-bad'}" style="min-width:56px">${s.p}%</span></td></tr>`).join('')||'<tr><td class="empty" colspan="5">Sem remates com local na baliza.</td></tr>'}
   </tbody></table></div></section>
  <section class="panel"><div class="pc-h"><h3 class="mini" style="margin:0">De onde rematou o adversário</h3></div>${pitchMarkup('grpitch')}
   <h3 class="mini" style="margin-top:16px">% de defesas por zona do campo</h3>${pctBars('fzone',FIELD_ZONES)}</section>
 </div>
 <div class="an-grid3">
  <section class="panel"><h3 class="mini">% de defesas por distância</h3>${pctBars(distBand,DIST_BANDS.map(d=>d[0]))}</section>
  <section class="panel"><h3 class="mini">% de defesas por situação</h3>${pctBars('sit',STD)}</section>
  <section class="panel"><h3 class="mini">% de defesas por período</h3>${pctBars('period',PERIODS)}</section>
 </div>
 <section class="panel">
  <div class="rec-head"><h2 class="sub">Comparação entre guarda-redes</h2><button type="button" class="btn btn-outline btn-sm" id="gr-exp">${icon('download')}Exportar CSV</button></div>
  <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th class="l">Guarda-redes</th><th>À baliza</th><th>Defesas</th><th>Controladas</th><th>Para fora</th><th>Golos sofridos</th><th>Fora</th><th>% defesas</th><th>Tempo jogado</th><th>Golos / 8'</th></tr></thead><tbody id="gr-cmp"></tbody></table></div>
 </section>`;
 const cmp=gks.map(n=>{const s=grStats(all.filter(r=>r.player===n)),t=grs.period?0:(shifts[n]?.total||0);return {n,s,t}});
 $('#gr-cmp').innerHTML=cmp.length?cmp.map(({n,s,t})=>`<tr><td class="l">${esc(plabel(n))}</td><td>${s.on}</td><td><b>${s.sv}</b></td><td>${s.hold}</td><td>${s.away}</td><td>${s.gl}</td><td>${s.out}</td><td><b>${fmtPct(s.sv,s.on)}</b></td><td>${grs.period?'—':fmtClock(t)}</td><td>${t>=60?numPT(s.gl*480/t):'—'}</td></tr>`).join(''):'<tr><td class="empty" colspan="10">Marca os guarda-redes no plantel (página Jogadores ou Exclusões).</td></tr>';
 $('#grgoal').style.cursor='default';$('#grpitch').style.cursor='default';
 $('#grgoal-saved').innerHTML=markerGroup(rows,'g','#203631',2.4);
 $('#grpitch-saved').innerHTML=markerGroup(rows,'f','#ffffff',2.4);

function renderColTabs(){$('#col-tabs').innerHTML=COL_TABLES.map((t,i)=>`<button type="button" role="tab" class="tab ${col.active===t.id?'on':''}" data-tab="${t.id}" aria-selected="${col.active===t.id}"><small>${String(i+1).padStart(2,'0')}</small>${esc(t.tab)}</button>`).join('')}
function renderColForm(){
 const t=colTable(),g=G(),r=col.editing?g.collective.find(x=>x.id===col.editing):null;
 const period=r?r.period:g.period, attack=r?r.attack:(S().autoAttack?nextAttack(t.id,period):'');
 const fh=([k,label,opts,kind])=>{const val=r?r[k]:'';
  if(kind==='toggle')return `<div class="field"><span class="lbl">${label}</span><div class="timing">${opts.map(o=>`<button type="button" data-time="${o}" class="${col.timing===o?'on':''}">${o}</button>`).join('')}</div></div>`;
  if(kind==='notes')return `<div class="field wide"><label for="cf-${k}">${label}</label><input id="cf-${k}" value="${esc(val)}" placeholder="Observações (opcional)"></div>`;
  if(kind==='combo')return `<div class="field"><label for="cf-${k}">${label}</label>${comboHTML('cf-'+k,val,'Pesquisar…')}</div>`;

 t.fields.filter(f=>f[3]==='combo').forEach(([k,,opts])=>bindCombo($(`[data-combo="cf-${k}"]`),opts));
 $('#cf-period').onchange=e=>{if(!col.editing&&S().autoAttack)$('#cf-attack').value=nextAttack(t.id,e.target.value)};
 $('#col-savelbl').textContent=col.editing?'Atualizar registo':'Guardar registo';
 $('#col-warn').innerHTML=col.editing?`<div class="editing-note" style="margin-top:12px">A editar o ataque nº ${esc(r?r.attack:'')} (${esc(r?r.period:'')} período). Carrega em <b>Atualizar registo</b> ou em Limpar para cancelar.</div>`:'';
 $('#col-title').textContent='Registos — '+t.title;

async function colSave(){
 const t=colTable(),g=G();
 const rec={id:col.editing||uid(),table:t.id,period:$('#cf-period').value,attack:$('#cf-attack').value,ts:Date.now()};
 const miss=[];if(!rec.period)miss.push('período');if(!rec.attack)miss.push('nº do ataque');
 t.fields.forEach(([k,label,opts,kind])=>{if(kind==='toggle'){rec[k]=col.timing;return}const el=$('#cf-'+k);rec[k]=el?el.value.trim():'';if(kind!=='notes'&&!rec[k])miss.push(label.toLowerCase());if(kind==='combo'&&rec[k]&&!opts.includes(rec[k]))miss.push(label.toLowerCase()+' (opção válida)')});
 if(miss.length){$('#col-warn').innerHTML=`<div class="warnbox"><b>Faltam pressupostos:</b> ${esc(miss.join(', '))}.</div>`;toast('Faltam pressupostos: '+miss.join(', '),'warn');return}
 if(!col.editing&&g.collective.some(r=>r.table===t.id&&r.period===rec.period&&r.attack===rec.attack)){
  if(!await confirmBox('Ataque repetido',`Já existe o ataque nº <b>${esc(rec.attack)}</b> no ${esc(rec.period)} período nesta tabela. Guardar mesmo assim?`,'Guardar',false))return}
 const prev=col.editing&&g.collective.find(x=>x.id===col.editing);if(prev)rec.ts=prev.ts;
 if(prev)g.collective=g.collective.map(x=>x.id===rec.id?rec:x);else g.collective.push(rec);
 save();toast(prev?'Registo atualizado':`Ataque nº ${rec.attack} guardado`);
 col.editing=null;col.timing='+10s';
 renderColForm();renderColRecords();
}
function renderColRecords(){

 const opt=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');

 on('#cfl-p','period');on('#cfl-1','k1');on('#cfl-2','k2');on('#cfl-o','outcome');

   if(k==='outcome')return `<td><span class="badge ${outcomeTone(v,t.side)}">${esc(v)}</span></td>`;
   if(k==='timing')return `<td><span class="badge ${v==='+10s'?'t-good':'t-bad'}" style="min-width:52px">${esc(v)}</span></td>`;
   if(k==='notes')return `<td class="l" style="min-width:160px">${esc(v||'—')}</td>`;

  :`<tr><td class="empty" colspan="${keys.length+2}">Ainda não há registos nesta tabela${Object.values(f).some(Boolean)?' com estes filtros':''}.</td></tr>`;
 $('#col-count').textContent=`${rows.length} registo(s) encontrado(s)`;
}
const COL_CSV=[['table','Tabela'],['period','Período'],['attack','Nº Ataque'],['offense','Jogada Ofensiva'],['defense','Jogada Defensiva / Defesa'],['system','Sistema +1'],['ca','Contra-ataque'],['position','Posição Remate'],['outcome','Outcome'],['timing','Tempo ATQ'],['notes','Notas']];

 const g=G();g.collective=mode==='replace'?recs:g.collective.concat(recs);save();renderColetiva();toast(recs.length+' registo(s) importado(s)');

function addMove(n,type){const g=G();g.timer.seq=(g.timer.seq||0)+1;g.timer.events.push({id:uid(),n,type,period:g.period,clock:Math.round(clockNow()),seq:g.timer.seq,ts:Date.now()})}

async function moveIn(n){
 const g=G(),s=computeShifts(),pool=Object.keys(s).map(Number).filter(k=>s[k].on),me=s[n];

 const saves=K.filter(r=>r.action==='Defesa GR'||r.action==='Defesa p/ Fora GR'),conc=K.filter(r=>r.action==='Golo Sofrido');
 const excW=F.filter(r=>r.action==='EXC ganha').length,excL=F.filter(r=>r.action==='EXC sofrida').length;
 const tab=id=>C.filter(r=>r.table===id),cv=rs=>({n:rs.length,g:rs.filter(r=>r.outcome==='GOLO').length});
 const plus=cv(tab('plus')),minus=cv(tab('minus')),caS=cv(tab('caSCP')),caO=cv(tab('caOther'));
 const sprW=g.sprints.filter(s=>s.winner==='SCP').length,sprP=g.sprints.filter(s=>s.winner).length;
 const teamEff=pct(goals.length,shots.length);
 const shifts=computeShifts();

 /* ---- jogadores ---- */
 const pl=g.roster.map(p=>{const mine=F.filter(r=>r.player===p.n),sh=mine.filter(r=>SHOT_ACTS.includes(r.action)),gl=sh.filter(r=>r.action==='Golo').length;
  const c=a=>mine.filter(r=>r.action===a).length;const secs=P?0:shifts[p.n].total;
  return {n:p.n,gr:p.gr,name:pname(p.n),shots:sh.length,goals:gl,eff:pct(gl,sh.length),ast:F.filter(r=>r.assist===p.n).length,excW:c('EXC ganha'),excL:c('EXC sofrida'),lost:c('Perda Bola')+c('Passe Falhado')+c('Falta Atacante'),steal:c('Roubo Bola'),blk:c('Bloco Defensivo'),secs,g8:secs>=60?(gl*480/secs):null,any:mine.length||secs>0}}).filter(x=>x.any&&!x.gr);

 /* ---- leituras automáticas ---- */
 const ins=[];const add=(tone,title,text)=>ins.push({tone,title,text});
 if(shots.length<6)add('info','Poucos remates registados',`Há ${shots.length} remate(s) ${P?'neste período':'neste jogo'}. As leituras abaixo ficam mais fiáveis com mais registos.`);
 if(shots.length){add(teamEff>=40?'good':teamEff<30?'bad':'info','Eficácia de remate',`O SCP marcou ${goals.length} golos em ${shots.length} remates (${teamEff}%). ${shots.filter(r=>r.action==='Bloco').length} remates foram bloqueados e ${shots.filter(r=>r.action==='Fora').length} saíram fora.`)}
 if(!P){const h1=shots.filter(r=>r.period==='1º'||r.period==='2º'),h2=shots.filter(r=>r.period==='3º'||r.period==='4º');
  if(h1.length>=4&&h2.length>=4){const e1=pct(h1.filter(r=>r.action==='Golo').length,h1.length),e2=pct(h2.filter(r=>r.action==='Golo').length,h2.length);
   if(Math.abs(e1-e2)>=15)add(e2<e1?'bad':'good','Mudança entre metades',`A eficácia passou de ${e1}% na 1.ª metade para ${e2}% na 2.ª. ${e2<e1?'Pode indicar fadiga ou um ajuste defensivo do adversário.':'A equipa melhorou a seleção de remate ao longo do jogo.'}`)}}
 const zones=effRows(groupBy(shots,'fzone'),r=>r.action==='Golo').filter(z=>z.n>=3).sort((a,b)=>b.e-a.e||b.n-a.n);
 if(zones.length>=2){const b=zones[0],w=zones[zones.length-1];add('good','Zona de remate mais eficaz',`${b.k}: ${b.g} golo(s) em ${b.n} remates (${b.e}%).`);if(w.e<b.e)add('bad','Zona de remate menos eficaz',`${w.k}: ${w.g} golo(s) em ${w.n} remates (${w.e}%). Vale a pena rever se estes remates são de boa qualidade ou forçados.`)}
 const far=shots.filter(r=>/Lateral|Central|Meio-campo/.test(r.fzone)).length;
 if(shots.length>=8)add(far/shots.length>0.6?'bad':'info','Distância de remate',`${pct(far,shots.length)}% dos remates foram de fora dos 6M. ${far/shots.length>0.6?'Muitos remates de longe: tentar chegar mais vezes ao pivot ou às pontas.':'Boa parte do volume é perto da baliza.'}`);
 const gz=[...groupBy(goals,'gzone')].sort((a,b)=>b[1].length-a[1].length);
 if(gz.length&&goals.length>=3)add('info','Onde entram os golos do SCP',`Mais golos no ${gz[0][0].toLowerCase()} (${gz[0][1].length} de ${goals.length}).`);
 const fig=F.filter(r=>r.action==='Defesa'&&r.gzone==='Figura').length,def=F.filter(r=>r.action==='Defesa').length;
 if(def>=3&&fig/def>=0.3)add('bad','Remates à figura',`${fig} das ${def} defesas do GR adversário foram em remates à figura. Procurar os cantos ou rematar após deslocar o GR.`);
 if(saves.length+conc.length>=4){const sp=pct(saves.length,saves.length+conc.length),cz=[...groupBy(conc,'gzone')].sort((a,b)=>b[1].length-a[1].length);
  add(sp>=50?'good':'bad','Guarda-redes SCP',`${sp}% de defesas (${saves.length} defesas, ${conc.length} golos sofridos).${cz.length?` A zona mais batida foi ${cz[0][0].toLowerCase()} (${cz[0][1].length}).`:''}`)}
 const sits=effRows(groupBy(shots,'sit'),r=>r.action==='Golo').filter(s=>s.n>=3).sort((a,b)=>b.e-a.e);
 if(sits.length>=2)add('info','Situações de jogo',`Melhor eficácia em ${sits[0].k} (${sits[0].e}%, ${sits[0].n} remates); pior em ${sits[sits.length-1].k} (${sits[sits.length-1].e}%).`);
 const top=pl.slice().sort((a,b)=>b.goals-a.goals||a.shots-b.shots)[0];
 if(top&&top.goals)add('good','Melhor marcador',`${top.n} · ${top.name}: ${top.goals} golo(s) em ${top.shots} remates (${top.eff}%).`);
 pl.filter(p=>p.shots>=4&&p.eff<=teamEff-20).slice(0,2).forEach(p=>add('bad','Eficácia individual baixa',`${p.n} · ${p.name}: ${p.goals}/${p.shots} (${p.eff}%), bem abaixo da equipa (${teamEff}%).`));
 if(excW+excL>=3)add(excW>=excL?'good':'bad','Exclusões',`O SCP ganhou ${excW} e sofreu ${excL} exclusão(ões)${P?'':' no jogo'}.`);
 if(plus.n)add(pct(plus.g,plus.n)>=35?'good':'bad','Superioridade (+1)',`Convertidas ${plus.g} de ${plus.n} (${pct(plus.g,plus.n)}%).`);
 if(minus.n)add(minus.n-minus.g>=minus.g?'good':'bad','Inferioridade (−1)',`O SCP defendeu ${minus.n-minus.g} de ${minus.n} superioridades do adversário (${100-pct(minus.g,minus.n)}%).`);
 const lost=F.filter(r=>['Perda Bola','Passe Falhado','Falta Atacante'].includes(r.action));
 if(lost.length>=3){const tl=pl.slice().sort((a,b)=>b.lost-a.lost)[0];add('bad','Perdas de posse',`${lost.length} posses perdidas (perdas, passes falhados, faltas atacantes)${tl&&tl.lost>=2?`; ${tl.n} · ${tl.name} com ${tl.lost}`:''}. Os roubos de bola foram ${F.filter(r=>r.action==='Roubo Bola').length}.`)}
 const offs=effRows(groupBy(tab('scp'),'offense'),r=>r.outcome==='GOLO').filter(x=>x.n>=2).sort((a,b)=>b.e-a.e||b.n-a.n);
 if(offs.length>=2)add('good','Jogada ofensiva que mais resulta',`"${offs[0].k}": ${offs[0].g}/${offs[0].n} (${offs[0].e}%). A menos produtiva foi "${offs[offs.length-1].k}" (${offs[offs.length-1].e}%).`);
 const dfs=effRows(groupBy(tab('scp'),'defense'),r=>r.outcome==='GOLO').filter(x=>x.n>=2).sort((a,b)=>a.e-b.e);
 if(dfs.length>=2)add('bad','Defesa adversária que mais travou o SCP',`Contra "${dfs[0].k}" o SCP marcou ${dfs[0].g} em ${dfs[0].n} ataques (${dfs[0].e}%).`);
 const oo=[...groupBy(tab('other').filter(r=>r.outcome==='GOLO'),'offense')].sort((a,b)=>b[1].length-a[1].length);
 if(oo.length&&oo[0][1].length>=2)add('bad','Jogada adversária mais perigosa',`"${oo[0][0]}" deu ${oo[0][1].length} golos ao adversário.`);
 const tA=tab('scp'),t10=tA.filter(r=>r.timing==='+10s'),tm=tA.filter(r=>r.timing==='-10s');
 if(t10.length>=3&&tm.length>=3){const a=pct(t10.filter(r=>r.outcome==='GOLO').length,t10.length),b=pct(tm.filter(r=>r.outcome==='GOLO').length,tm.length);add('info','Tempo de ataque',`Ataques com +10s: ${a}% de golo (${t10.length}); com −10s: ${b}% (${tm.length}). ${a>b+10?'Ataques mais longos estão a render mais.':b>a+10?'O SCP finaliza melhor em ataques rápidos.':'Sem grande diferença entre ataques curtos e longos.'}`)}
 if(!P){const cp=PERIODS.map(p=>({p,n:g.individual.filter(r=>r.mode==='gk'&&r.action==='Golo Sofrido'&&r.period===p).length})).sort((a,b)=>b.n-a.n);if(cp[0].n>=2)add('bad','Período mais difícil',`O ${cp[0].p} período foi onde o SCP sofreu mais golos (${cp[0].n}).`)}
 if(!P){const pm=pl.filter(p=>p.g8!=null&&p.secs>=300).sort((a,b)=>b.g8-a.g8)[0];if(pm&&pm.goals)add('info','Rendimento por tempo jogado',`${pm.n} · ${pm.name}: ${pm.g8.toFixed(1).replace('.',',')} golos por cada 8 minutos na água (${fmtClock(pm.secs)} jogados).`)}
 if(sprP)add(sprW>=sprP/2?'good':'bad','Bolas de saída',`O SCP ganhou ${sprW} de ${sprP} sprints.`);

 /* ---- render ---- */
 const kpi=(k,v,s)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 const v=$('#view-analise');
 v.innerHTML=`

   <div class="field" style="min-width:160px"><label for="an-p">Período</label><select id="an-p"><option value="">Jogo todo</option>${PERIODS.map(p=>`<option ${P===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
  <div class="kpis">

   ${kpi('Defesas GR',saves.length+conc.length?pct(saves.length,saves.length+conc.length)+'%':'—',`${saves.length} defesas · ${conc.length} golos`)}
   ${kpi('Exclusões',`${excW}–${excL}`,'ganhas – sofridas')}
   ${kpi('Superioridade +1',plus.n?pct(plus.g,plus.n)+'%':'—',`${plus.g} golo(s) em ${plus.n}`)}
   ${kpi('Inferioridade −1',minus.n?(100-pct(minus.g,minus.n))+'%':'—',`${minus.n-minus.g} defendidas de ${minus.n}`)}

  </div>
 </section>
 <section class="panel"><h2 class="sub">Leituras automáticas</h2><div class="insights" style="margin-top:12px">${ins.map(i=>`<div class="ins ${i.tone}"><span class="dot">${i.tone==='good'?'↑':i.tone==='bad'?'!':'i'}</span><div><b>${esc(i.title)}</b><p>${esc(i.text)}</p></div></div>`).join('')}</div></section>
 <div class="an-grid3">
  <section class="panel"><h3 class="mini">Eficácia de remate por zona</h3>${zoneMapSVG(shots)}<p class="muted small" style="margin:8px 0 0">Amarelo mais forte = maior % de golo.</p></section>
  <section class="panel"><h3 class="mini">Onde entram os golos do SCP</h3>${goalHeatSVG(goals,'#1e9e4a')}<p class="muted small" style="margin:8px 0 0">${goals.length} golos com local registado.</p></section>
  <section class="panel"><h3 class="mini">Golos sofridos pelo GR SCP</h3>${goalHeatSVG(conc,'#d93232')}<p class="muted small" style="margin:8px 0 0">${conc.length} golos sofridos com local registado.</p></section>
 </div>
 <section class="panel">
  <div class="rec-head"><h2 class="sub">Resumo por jogador</h2><button type="button" class="btn btn-outline btn-sm" id="an-exp">${icon('download')}Exportar CSV</button></div>
  <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th class="l">Jogador</th><th>Remates</th><th>Golos</th><th>Eficácia</th><th>Assist.</th><th>EXC ganhas</th><th>EXC sofridas</th><th>Perdas</th><th>Roubos</th><th>Blocos def.</th><th>Tempo jogado</th><th>Golos / 8'</th></tr></thead><tbody>
  ${pl.length?pl.map(p=>`<tr><td class="l">${esc(p.n+' · '+p.name)}</td><td>${p.shots}</td><td><b>${p.goals}</b></td><td>${p.shots?p.eff+'%':'—'}</td><td>${p.ast}</td><td>${p.excW}</td><td>${p.excL}</td><td>${p.lost}</td><td>${p.steal}</td><td>${p.blk}</td><td>${P?'—':fmtClock(p.secs)}</td><td>${p.g8!=null?p.g8.toFixed(1).replace('.',','):'—'}</td></tr>`).join(''):'<tr><td class="empty" colspan="12">Ainda sem registos de jogadores de campo.</td></tr>'}
  </tbody></table></div>
 </section>
 <div class="an-grid">
  <section class="panel"><h3 class="mini">Eficácia por situação de jogo</h3>${barsHTML(effRows(groupBy(shots,'sit'),r=>r.action==='Golo').sort((a,b)=>STD.indexOf(a.k)-STD.indexOf(b.k)).map(x=>({label:x.k,v:x.e,x})),{max:100,fmt:i=>`${i.v}% <small>${i.x.g}/${i.x.n}</small>`})}</section>

  <section class="panel"><h3 class="mini">Jogadas ofensivas SCP · % de golo</h3>${barsHTML(effRows(groupBy(tab('scp'),'offense'),r=>r.outcome==='GOLO').sort((a,b)=>b.e-a.e||b.n-a.n).map(x=>({label:x.k,v:x.e,x})),{max:100,fmt:i=>`${i.v}% <small>${i.x.g}/${i.x.n}</small>`})}</section>
  <section class="panel"><h3 class="mini">Eficácia SCP contra cada defesa adversária</h3>${barsHTML(effRows(groupBy(tab('scp'),'defense'),r=>r.outcome==='GOLO').sort((a,b)=>b.e-a.e).map(x=>({label:x.k,v:x.e,x})),{max:100,fmt:i=>`${i.v}% <small>${i.x.g}/${i.x.n}</small>`})}</section>
  <section class="panel"><h3 class="mini">Defesas SCP · golos sofridos por sistema</h3>${barsHTML(effRows(groupBy(tab('other'),'defense'),r=>r.outcome==='GOLO').sort((a,b)=>b.e-a.e).map(x=>({label:x.k,v:x.e,x,bad:true})),{max:100,fmt:i=>`${i.v}% <small>${i.x.g}/${i.x.n}</small>`})}</section>
  <section class="panel"><h3 class="mini">Posição de remate · ataques SCP</h3>${barsHTML(effRows(groupBy(C.filter(r=>['scp','plus','caSCP'].includes(r.table)),'position'),r=>r.outcome==='GOLO').sort((a,b)=>COL_OPTS.positions.indexOf(a.k)-COL_OPTS.positions.indexOf(b.k)).map(x=>({label:x.k,v:x.e,x})),{max:100,fmt:i=>`${i.v}% <small>${i.x.g}/${i.x.n}</small>`})}</section>
 </div>`;
 $('#an-p').onchange=e=>{an.period=e.target.value;renderAnalise()};
 $('#an-exp').onclick=()=>{if(!pl.length){toast('Sem dados para exportar.','warn');return}download('interpretacao_jogadores_'+fileStamp()+'.csv',toCSV([['Nº','Jogador','Remates','Golos','Eficácia (%)','Assistências','EXC ganhas','EXC sofridas','Perdas','Roubos','Blocos defensivos','Tempo jogado','Golos por 8 min'],...pl.map(p=>[p.n,p.name,p.shots,p.goals,p.eff,p.ast,p.excW,p.excL,p.lost,p.steal,p.blk,P?'':fmtClock(p.secs),p.g8!=null?numPT(p.g8):''])]))};

/* =========================================================
   DEFINIÇÕES — regras de registo, equipa, dados e cópias de segurança
   ========================================================= */
function renderDefinicoes(){
 const g=G(),st=S(),v=$('#view-definicoes');
 let bytes=0;try{bytes=new Blob([localStorage.getItem(STORE_KEY)||'']).size}catch(e){}
 const games=Object.values(DB.games),recs=games.reduce((a,x)=>a+x.individual.length+x.collective.length+x.timer.events.length+x.exclLog.length,0);
 const LIMIT=5*1024*1024;
 const sw=(key,title,desc)=>`<div class="set-row"><div><b>${title}</b><span>${desc}</span></div><button type="button" class="switch" role="switch" aria-checked="${!!st[key]}" data-set="${key}" aria-label="${esc(title)}"></button></div>`;
 v.innerHTML=`
 <section class="panel">
  <div class="view-head"><div><h1 class="title">Definições</h1><p>As regras aplicam-se a todos os jogos neste dispositivo. As alterações ficam guardadas logo.</p></div></div>
  <div class="set-grid">
   <div>
    <h3 class="mini">Equipa e jogo</h3>
    <div class="set-row"><div><b>Nome da equipa</b><span>Usado nos novos jogos e no jogo aberto.</span></div><input class="inp" id="st-team" value="${esc(st.teamName)}" style="width:200px"></div>
    <div class="set-row"><div><b>Duração do período (novos jogos)</b><span>Os jogos seniores usam 8 minutos.</span></div><select class="inp" id="st-plen" style="width:140px">${[5,6,7,8].map(m=>`<option value="${m*60}" ${st.periodLength===m*60?'selected':''}>${m} minutos</option>`).join('')}</select></div>
    <div class="set-row"><div><b>Duração do período (jogo aberto)</b><span>${esc(fmtDate(g.date))} vs ${esc(g.opponent)}</span></div><select class="inp" id="st-gplen" style="width:140px">${[5,6,7,8].map(m=>`<option value="${m*60}" ${g.periodLength===m*60?'selected':''}>${m} minutos</option>`).join('')}</select></div>
    <div class="set-row"><div><b>Máximo de jogadores na água</b><span>Bloqueia o botão Entrar no Tempo de Jogo.</span></div><select class="inp" id="st-pool" style="width:140px">${[5,6,7].map(n=>`<option value="${n}" ${st.maxInPool===n?'selected':''}>${n} jogadores</option>`).join('')}</select></div>
   </div>
   <div>
    <h3 class="mini">Regras de registo</h3>
    ${sw('assistRequired','Assistência obrigatória','Em Golo e EXC ganha é preciso escolher quem assistiu (ou "Sem assistência").')}
    ${sw('autoAttack','Avançar o nº do ataque','Na Estatística Coletiva, o próximo ataque fica já escolhido depois de guardar.')}
    ${sw('resetClockOnPeriod','Repor o relógio ao mudar de período','Ao escolher outro período, o relógio volta à duração completa e pára.')}
   </div>
  </div>
 </section>
 <div class="set-grid">
  <section class="panel">
   <h2 class="sub">Dados neste dispositivo</h2>
   <div class="store-meter" aria-hidden="true"><i style="width:${Math.min(100,Math.max(1,bytes*100/LIMIT))}%"></i></div>
   <p class="muted small" style="margin:0 0 12px">${(bytes/1024).toFixed(0)} KB usados de cerca de 5 MB disponíveis no browser · ${games.length} jogo(s) · ${recs} registo(s)${storageOK?'':' · <b style="color:var(--red)">o browser está a bloquear o armazenamento</b>'}</p>
   <div class="btn-row"><button type="button" class="btn btn-outline" id="st-backup">${icon('download')}Cópia de segurança de tudo</button><button type="button" class="btn btn-ghost" id="st-restore">${icon('upload')}Restaurar cópia</button></div>
   <div class="btn-row" style="margin-top:8px"><button type="button" class="btn btn-ghost" id="st-demo">${icon('plus')}Adicionar jogo de exemplo</button><button type="button" class="btn btn-danger" id="st-wipe">${icon('trash')}Apagar todos os dados</button></div>
   <p class="muted small" style="margin:12px 0 0">A cópia de segurança (.json) inclui todos os jogos e estas definições. Para um só jogo usa Início › Exportar jogo; para Excel, o Exportar CSV de cada página.</p>
  </section>
  <section class="panel">
   <h2 class="sub">Instalação</h2>
   <div class="install-slot" style="margin-top:12px">${installCardHTML()}</div>
   <ol class="steps-list">
    <li>Depois de instalada, a app abre em ecrã inteiro e funciona sem internet, incluindo na piscina.</li>
    <li>Os dados ficam no dispositivo onde foram registados. Exporta o jogo no fim de cada partida.</li>
    <li>Quando houver uma versão nova da app, aparece um aviso "Atualizar agora". Os dados mantêm-se.</li>
   </ol>
   <p class="muted small" style="margin:12px 0 0">SCP Stat · Polo Aquático · versão 0.3 (${esc(APP_VERSION.startsWith('__')?'local':APP_VERSION)})</p>
  </section>
 </div>`;
 $$('[data-set]',v).forEach(b=>b.onclick=()=>{const k=b.dataset.set;DB.settings[k]=!DB.settings[k];b.setAttribute('aria-checked',String(DB.settings[k]));save(true);toast('Definição guardada')});
 $('#st-team').onchange=e=>{const n=e.target.value.trim()||'Sporting CP';DB.settings.teamName=n;g.scpName=n;save();toast('Nome da equipa guardado')};
 $('#st-plen').onchange=e=>{DB.settings.periodLength=+e.target.value;save(true);toast('Duração para novos jogos: '+fmtClock(+e.target.value))};
 $('#st-gplen').onchange=e=>{g.periodLength=+e.target.value;if(!g.timer.running&&g.timer.remaining>g.periodLength)g.timer.remaining=g.periodLength;save();toast('Duração do período deste jogo: '+fmtClock(g.periodLength))};
 $('#st-pool').onchange=e=>{DB.settings.maxInPool=+e.target.value;save(true);toast('Máximo na água: '+e.target.value)};
 $('#st-backup').onclick=()=>download('scp_stat_copia_seguranca_'+todayISO()+'.json',JSON.stringify({app:'scp-stat-polo',version:1,kind:'backup',exported:new Date().toISOString(),settings:DB.settings,currentId:DB.currentId,games:DB.games}),'application/json');
 $('#st-restore').onclick=restoreBackup;
 $('#st-demo').onclick=()=>{const d=buildDemoGame();DB.games[d.id]=d;DB.currentId=d.id;save();resetLocalState();renderDefinicoes();toast('Jogo de exemplo adicionado e aberto')};
 $('#st-wipe').onclick=async()=>{
  if(!await confirmBox('Apagar todos os dados',`Vais apagar <b>${games.length} jogo(s)</b> e todos os registos deste dispositivo. Faz antes uma cópia de segurança se precisares destes dados.`,'Continuar'))return;
  const ok=await modal({title:'Confirmar',body:'<p>Escreve <b>APAGAR</b> para confirmar.</p><input id="m-conf" class="inp" autocomplete="off">',actions:[{label:'Cancelar',cls:'btn-ghost',value:false},{label:'Apagar tudo',cls:'btn-danger',get:r=>r.querySelector('#m-conf').value.trim().toUpperCase()==='APAGAR'}]});
  if(!ok){toast('Nada foi apagado.');return}
  const n=newGame();DB.games={[n.id]:n};DB.currentId=n.id;save();resetLocalState();renderDefinicoes();toast('Dados apagados. Começaste um jogo vazio.')};
}
async function restoreBackup(){
 const f=await pickFile('.json,application/json');if(!f)return;
 let d;try{d=JSON.parse(f.text)}catch(e){toast('Este ficheiro não é uma cópia da SCP Stat (.json).','bad');return}
 if(!d||d.app!=='scp-stat-polo'){toast('Este ficheiro não é uma cópia da SCP Stat (.json).','bad');return}
 const incoming=d.kind==='backup'?Object.values(d.games||{}):(d.game?[d.game]:[]);
 if(!incoming.length){toast('A cópia não tem jogos.','warn');return}
 const mode=await modal({title:'Restaurar cópia',body:`<p>A cópia tem <b>${incoming.length}</b> jogo(s). Juntar aos jogos deste dispositivo (os jogos iguais são atualizados) ou substituir tudo?</p>`,actions:[{label:'Cancelar',cls:'btn-ghost',value:null},{label:'Substituir tudo',cls:'btn-danger',value:'replace'},{label:'Juntar',cls:'btn-primary',value:'merge'}]});
 if(!mode)return;
 if(mode==='replace')DB.games={};
 incoming.forEach(x=>{normalizeGame(x);DB.games[x.id]=x});
 if(d.kind==='backup'&&d.settings&&mode==='replace')DB.settings={...DEFAULT_SETTINGS,...d.settings};
 DB.currentId=(d.currentId&&DB.games[d.currentId])?d.currentId:incoming[0].id;
 save();resetLocalState();rerender();toast(incoming.length+' jogo(s) restaurado(s)');
}

})();
</script>
